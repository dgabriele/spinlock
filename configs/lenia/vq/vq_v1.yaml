# VQ Tokenizer — Lenia Pyramid-First (Behavioral Tokenization)
#
# Produces behavioral tokens from Lenia trajectory dynamics.
# Tokens are discrete identifiers for behavioral equivalence classes.
#
# Core losses only: VQ commitment, reconstruction, topographic, balance.
# No pixel-space aux heads — token→rollout decoding handled by MNO.

dataset_path: "datasets/ds_lenia_v1.h5"
checkpoint_dir: "checkpoints/lenia/vq/v1"

# ── Feature source: learned CNN ──────────────────────────────
feature_source: "learned"
generation_config_path: "configs/lenia/datasets/ds_lenia_v1.yaml"
generation_timesteps: 512
replayer_cache_size: 16
realization_mode: "all"            # each realization tokenized independently (500K × 3 = 1.5M samples)

# ═══════════════════════════════════════════════════════════════
# Encoder Configuration
# ═══════════════════════════════════════════════════════════════

encoder:
  initial:
    variant: "cnn"
    cnn_embedding_dim: 384
    use_final_batchnorm: true
    # in_channels: auto-detected from dataset (3 for Lenia)

  temporal:
    variant: "pyramid"
    learned:
      architecture: "pyramid_first"
      # in_channels: auto-detected from ICs (3 for Lenia)
      d_cnn: 256              # CNN output dim per frame
      d_agg: 128              # per-level temporal aggregation dim
      num_groups: 30           # learned groups
      gated_groups: true       # per-group learnable gates for downstream adaptivity
      gate_init_bias: 5.0      # sigmoid(5.0) ≈ 0.993 → gates start nearly open
    level_dims: [6, 12, 20, 26]        # VQ hierarchy split (sum=64 = D_group)
    downsample_factors: [2, 4, 8, 16]   # Trajectory pyramid factors (512T → 256/128/64/32 frames)
    variable_length:
      enabled: true
      min_timesteps: 32
      max_timesteps: 512
      length_bins: [32, 64, 128, 256, 512]
      sampling_strategy: "fixed_bins"
      adaptive_pyramid: true
      min_pyramid_length: 1
      mask_downsample_method: "ceil"
      # curriculum_start_min removed — VQ converges without it

  # Theta config kept for param_dim auto-detection (dimensions only)
  theta:
    variant: "direct"
    # param_dim: auto-detected from dataset (16 for 3-channel Lenia)

  embedding_dim: 32                    # per-group VQ input dim (= D_group)
  hidden_dim: 128
  dropout: 0.1
  use_layer_norm: true

# ═══════════════════════════════════════════════════════════════
# Auxiliary Heads — IC decoded from temporal tokens
# ═══════════════════════════════════════════════════════════════

aux_heads:
  theta_enabled: false
  theta_probe_enabled: false

  initial_enabled: false          # disabled — MNO handles token→rollout decoding
  initial_probe_enabled: false

  trajectory_enabled: false       # disabled — MNO handles token→rollout decoding
  # Trajectory prototype decoder (disabled — MNO handles token→rollout decoding):
  # trajectory_num_keyframes: 16
  # trajectory_weight: 1.0
  # trajectory_spatial_size: 128
  # trajectory_latent_dim: 1024
  # trajectory_base_channels: 128

# ═══════════════════════════════════════════════════════════════
# Quantizer
# ═══════════════════════════════════════════════════════════════

quantizer:
  embedding_dim: 64
  commitment_cost: 0.25
  use_ema: true
  ema_decay: 0.99
  epsilon: 1.0e-5

# ═══════════════════════════════════════════════════════════════
# Hierarchy
# ═══════════════════════════════════════════════════════════════

hierarchy:
  num_levels: 3
  # level_ratios: [1.5, 0.75, 0.4]   # explicit per-level ratios (uses adaptive formula when unset)
  min_latent_dim: 4
  max_latent_dim: 192

# ═══════════════════════════════════════════════════════════════
# Training
# ═══════════════════════════════════════════════════════════════

training:
  num_epochs: 3
  batch_size: 96
  learning_rate: 0.001
  val_split: 0.1
  val_every_n_epochs: 1

  optimizer: "adamw"
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 2   # 96 × 2 = 192 effective batch size

  use_scheduler: true
  scheduler_type: "cosine"
  warmup_epochs: 1

  early_stopping_patience: 30
  early_stopping_min_delta: 0.001

  # Intra-epoch convergence stopping: stop mid-epoch when component losses
  # plateau below thresholds over a rolling window of batches.
  convergence_stop_enabled: true
  convergence_stop_vq: 0.001
  convergence_stop_recon: 0.0001
  convergence_stop_info: 0.001
  convergence_stop_topo_post: 0.999
  convergence_stop_window: 100
  convergence_stop_min_batches: 500

  dead_code_reset_interval: 500
  dead_code_threshold: 0.01

  device: "auto"
  compile_model: false

  # Flat dropout — no schedule needed with intra-epoch convergence stopping
  # (each sample seen ~once, so annealing has no effect)
  # dropout_schedule:
  #   type: cosine
  #   start: 0.3
  #   end: 0.1

  # Weight schedules (commented — available for future use):
  # weight_schedules:
  #   gate_sparsity_weight:
  #     type: linear
  #     start: 0.0
  #     end: 1.0


# ═══════════════════════════════════════════════════════════════
# Loss — Behavioral Discriminability
# ═══════════════════════════════════════════════════════════════

loss:
  reconstruction_weight: 0.1     # tokens must preserve encoded behavioral content
  orthogonality_weight: 0.1      # decorrelated group representations
  informativeness_weight: 0.1    # prevent group collapse
  informativeness_mode: "log_barrier"
  topographic_weight: 0.5        # KEY: distance preservation = behavioral discriminability
  topographic_n_samples: 192
  group_balance_weight: 2.0      # equalize per-group variance (learned projection mode)
  gate_sparsity_weight: 0.0      # 0 during pretraining; increase during joint fine-tuning
  normalize_reconstruction: true
  normalize_loss_scales: true
  loss_scale_ema_momentum: 0.99

# ═══════════════════════════════════════════════════════════════
# Normalization
# ═══════════════════════════════════════════════════════════════

normalization:
  method: "none"
  clip_std_multiplier: null

# ═══════════════════════════════════════════════════════════════
# System
# ═══════════════════════════════════════════════════════════════

random_seed: 7
verbose: true
log_level: "INFO"
