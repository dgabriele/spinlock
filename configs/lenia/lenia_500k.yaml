metadata:
  name: "lenia_500k"
  description: "3-channel Lenia CA, 64x64, 256 timesteps, wide parameter ranges, 500K samples"

parameter_space:
  architecture: {}
  stochastic: {}
  operator:
    # Per-channel kernel radii (C=3 → dims 0,1,2)
    kernel_radius_0: {type: continuous, bounds: [1.5, 35.0]}
    kernel_radius_1: {type: continuous, bounds: [1.5, 35.0]}
    kernel_radius_2: {type: continuous, bounds: [1.5, 35.0]}
    # Per-channel growth mu (dims 3,4,5)
    growth_mu_0: {type: continuous, bounds: [0.01, 0.6]}
    growth_mu_1: {type: continuous, bounds: [0.01, 0.6]}
    growth_mu_2: {type: continuous, bounds: [0.01, 0.6]}
    # Per-channel growth sigma (dims 6,7,8)
    growth_sigma_0: {type: continuous, bounds: [0.003, 0.25]}
    growth_sigma_1: {type: continuous, bounds: [0.003, 0.25]}
    growth_sigma_2: {type: continuous, bounds: [0.003, 0.25]}
    # Off-diagonal coupling entries 3x3-diagonal=6 (dims 10..15)
    coupling_01: {type: continuous, bounds: [-1.0, 1.5]}
    coupling_02: {type: continuous, bounds: [-1.0, 1.5]}
    coupling_10: {type: continuous, bounds: [-1.0, 1.5]}
    coupling_12: {type: continuous, bounds: [-1.0, 1.5]}
    coupling_20: {type: continuous, bounds: [-1.0, 1.5]}
    coupling_21: {type: continuous, bounds: [-1.0, 1.5]}
  evolution:
    # Shared time step (dim 9)
    dt: {type: continuous, bounds: [0.01, 0.4]}

sampling:
  strategy: "sobol_stratified"
  sobol:
    scramble: true
    seed: 42
    backend: "torch"
  total_samples: 500000
  batch_size: 500

simulation:
  operator_type: "lenia"
  device: "cuda"
  n_channels: 3
  grid_size: 64
  num_realizations: 3
  num_timesteps: 256
  lenia:
    kernel_type: "gaussian"
    alive_threshold: 0.01
    saturation_threshold: 0.95
    max_retries: 5

  # Diverse IC generation — 4 families targeting distinct spatial energy regimes
  input_generation:
    method: "sampled"
    ic_type_weights:
      # Localized blobs (30%) — concentrated energy → gliders, solitons, oscillators
      localized: 0.30
      # Gaussian random fields (25%) — smooth distributed energy at 3 variance levels
      gaussian_random_field_v0: 0.083   # gentle (variance=0.5)
      gaussian_random_field_v1: 0.083   # moderate (variance=1.0)
      gaussian_random_field_v2: 0.084   # strong (variance=2.0)
      # Multiscale GRF (25%) — band-limited multi-resolution energy
      multiscale_grf_low: 0.083         # large-scale structure
      multiscale_grf_mid: 0.083         # mid-scale patterns
      multiscale_grf_high: 0.084        # fine-scale textures
      # Structured sinusoidal (20%) — periodic seed patterns → standing waves, crystals
      structured: 0.20

    # Base-type parameters (used when no variant-specific override exists)
    localized:
      num_blobs: 5
      min_width: 4.0
      max_width: 16.0
    structured:
      num_structures: 3
      structure_types: ["circle", "stripe", "blob"]

    # Variant-specific parameters (override base type defaults)
    ic_variant_params:
      gaussian_random_field_v0:
        length_scale: 0.08
        variance: 0.5
      gaussian_random_field_v1:
        length_scale: 0.08
        variance: 1.0
      gaussian_random_field_v2:
        length_scale: 0.08
        variance: 2.0
      multiscale_grf_low:
        scales: [0.25, 0.30, 0.35]
        variance: 1.0
      multiscale_grf_mid:
        scales: [0.08, 0.10, 0.12]
        variance: 1.0
      multiscale_grf_high:
        scales: [0.02, 0.03, 0.04]
        variance: 1.0

dataset:
  output_path: "datasets/lenia_500k.h5"
  checkpoint_interval: 10000
  storage:
    compression: "lzf"
    chunk_size: 8
    store_trajectories: false  # Feature-only mode

features:
  initial:
    enabled: true
  temporal:
    enabled: false  # VQTokenizer uses learned CNN features
  summary:
    enabled: false

logging:
  level: "INFO"
  format: "structured"
