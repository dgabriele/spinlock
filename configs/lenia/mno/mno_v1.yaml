# Lenia V1 MNO — Quantization-Aware Training
#
# Goal: vqtokenize(mno_rollout) ≈ vqtokenize(gt_rollout)
# The MNO learns to produce trajectories whose VQ token sets match ground truth.
# Token CE (soft VQ cross-entropy) is the PRIMARY loss signal.
#
# Key differences from CNO config:
# - Replayer: auto-detected as LeniaReplayAdapter (shared simulator, no operator cache)
# - replayer_cache_size: 0 (Lenia doesn't cache per-operator state)
# - gate_weight_token_ce: true (pyramid-first encoder has gated groups)

model:
  base_channels: 32
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  dropout: 0.1
  param_conditioning: true
  param_embed_dim: 128
  conditioning_mode: "film"
  film: {enabled: true, embed_dim: 128, hidden_dim: 256}
  update_mode: "residual"
  use_checkpointing: true

training:
  n_samples: 10000           # Start small; scale after validation
  batch_size: 1
  gradient_accumulation_steps: 8
  epochs: 30
  learning_rate: 2.0e-4
  warmup_steps: 500
  weight_decay: 0.01
  clip_grad: 1.0
  timesteps: 256             # Full Lenia trajectory length
  bptt_window: 32
  film_lr_multiplier: 5.0
  replayer_cache_size: 0     # Lenia: shared simulator, no operator cache
  eval_every: 1
  eval_samples: 50

loss:
  lambda_traj: 0.1            # auxiliary — pixel regularization
  lambda_ic: 0.0              # disabled in QA mode
  lambda_contrastive: 0.3     # diversity
  lambda_token_ce: 1.0        # PRIMARY — vqtokenize(mno) ≈ vqtokenize(gt)
  token_ce_temperature: 1.0
  gate_weight_token_ce: true   # weight per-group CE by gate values
  normalize_loss_scales: true
  loss_scale_ema_momentum: 0.99
  contrastive:
    temperature: 0.1
    embed_dim: 128
    queue_size: 64

data:
  dataset_path: "datasets/ds_lenia_v1.h5"
  config: "configs/lenia/datasets/ds_lenia_v1.yaml"   # operator_type: "lenia" → LeniaReplayAdapter
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/lenia/mno/v1"
  save_every: 1
  keep_best: true

quantization_aware: true
tokenizer_checkpoint: "checkpoints/lenia/vq/v1/vq_tokenizer_best.pt"
token_dataset: "datasets/lenia_tokenized.h5"

device: "cuda"
seed: 42
