# Lenia V1 MNO — Trajectory-First U-AFNO
#
# Goal: Most accurate MNO possible — diverse trajectories conditioned on θ.
# Strategy: L_traj as primary loss. FiLM conditioning ensures different θ
# produce different rollouts (not mode-collapsed to mean behavior).
# No token conditioning — pure physics-driven trajectory matching.

model:
  backbone_type: "u_afno"
  base_channels: 32
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  dropout: 0.1
  param_conditioning: true
  param_embed_dim: 128
  conditioning_mode: "film"
  film: {enabled: true, embed_dim: 128, hidden_dim: 256}
  update_mode: "residual"
  use_checkpointing: true

training:
  n_samples: 1500
  batch_size: 2
  gradient_accumulation_steps: 16
  epochs: 2
  learning_rate: 5.0e-4
  warmup_optimizer_steps: 20
  weight_decay: 0.01
  clip_grad: 1.0
  timesteps: 256
  bptt_window: 32
  bptt_num_windows: 2
  film_lr_multiplier: 5.0
  replayer_cache_size: 0
  eval_every: 1
  eval_samples: 50

loss:
  lambda_traj: 1.0               # PRIMARY — trajectory MSE fidelity
  lambda_ic: 0.3                  # endpoint quality at t=0
  lambda_contrastive: 0.0
  lambda_centroid_mse: 0.0
  lambda_token_ce: 0.0
  lambda_token_head: 0.0
  normalize_loss_scales: false    # no normalization — direct MSE gradient

data:
  dataset_path: "datasets/ds_lenia_v1.h5"
  config: "configs/lenia/datasets/ds_lenia_v1.yaml"
  val_split: 0.1
  num_workers: 4
  realization_mode: "all"

checkpointing:
  save_dir: "checkpoints/lenia/mno/v1_traj_first"
  save_every: 1
  keep_best: true

resume_from: "checkpoints/lenia/mno/v1_traj_first/best.pt"
quantization_aware: false
tokenizer_checkpoint: "checkpoints/lenia/vq/v1/vq_tokenizer_latest.pt"
token_dataset: "datasets/ds_lenia_v1_temporal_resolution.h5"

device: "cuda"
seed: 42
