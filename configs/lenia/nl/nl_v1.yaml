# NLTokenizer v1 — Continuous VAE + LFM integration (learned features)
#
# Uses PyramidFirstEncoder on raw trajectories [B, T, C, H, W] — the same
# learned feature path that VQ v3 uses. On-the-fly trajectory generation
# via LeniaReplayAdapter.
#
# Usage:
#   spinlock train-nl-tokenizer --config configs/lenia/nl/nl_v1.yaml

dataset_path: "datasets/ds_lenia_fourier_10k.h5"
output_dir: "checkpoints/nl/v1"

# ── Feature source (production = learned) ──
feature_source: "learned"
generation_config_path: "configs/lenia/datasets/ds_lenia_fourier_10k.yaml"
generation_timesteps: 512
realization_mode: "all"
replayer_cache_size: 16

# ── Encoder (learned temporal + theta MLP) ──
encoder:
  temporal:
    variant: "pyramid"
    level_dims: [6, 12, 20, 26]  # unused by PyramidFirst but kept for schema
    downsample_factors: [2, 4, 8, 16]
    learned:
      architecture: "pyramid_first"
      # in_channels: auto-detected from dataset
      embedding_dim: 240
      num_groups: 30
      d_cnn: 256
      d_agg: 128
      gated_groups: true
      gate_init_bias: 5.0
    variable_length:
      enabled: true
      min_timesteps: 32
      max_timesteps: 512
      adaptive_pyramid: true
      min_pyramid_length: 4
  theta:
    variant: "mlp"
    # param_dim: auto-detected from dataset
    hidden_dim: 64
    output_dim: 32
    dropout: 0.1
  embedding_dim: 64   # D_group for learned projection
  hidden_dim: 128
  dropout: 0.1

# ── VAE bottleneck ──
vae:
  latent_dim: 256
  coarse_dim: 64
  encoder_hidden_dims: [1024, 512]
  decoder_hidden_dims: [512, 1024]

# ── LFM adapter ──
lfm_adapter:
  latent_dim: 256
  vocab_size: 8000
  max_output_len: 256
  decoder_hidden_dim: 256
  decoder_num_layers: 2
  decoder_num_heads: 4
  # pretrained_decoder_path: "checkpoints/lfm/decoder_pretrained.pt"
  # spm_model_path: "data/spm.model"
  freeze_decoder: true
  temperature: 1.0
  hard_sample: true

# ── NL Listener ──
listener:
  vocab_size: 8000
  hidden_dim: 256
  num_heads: 4
  num_layers: 2
  latent_dim: 256
  dropout: 0.1

# ── Inverse decoders ──
inverse:
  theta_hidden_dim: 128
  theta_dropout: 0.1
  ic_hidden_dim: 256
  ic_dropout: 0.1

# ── Loss ──
loss:
  reconstruction_weight: 1.0
  kl_weight: 0.1
  kl_free_bits: 2.0
  theta_inverse_weight: 1.0     # behavioral equivalence: ‖encoder(θ_hat) - encoder(θ_true)‖²
  ic_inverse_weight: 0.0        # no IC encoding in learned mode
  listener_roundtrip_weight: 1.0
  topographic_weight: 0.5       # preserve behavioral neighborhoods in z-space
  topographic_n_samples: 64

# ── Training ──
training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 0.0
  optimizer: "adam"
  val_split: 0.2
  val_every_n_epochs: 5
  gradient_accumulation_steps: 1
  use_scheduler: true
  scheduler_type: "cosine"
  warmup_batches: 100
  early_stopping_patience: 15
  device: "auto"
  kl_warmup_epochs: 10
  listener_start_epoch: 10
  log_every_n_batches: 20
  checkpoint_every_n_epochs: 10

normalization:
  method: "none"   # learned features don't need manual normalization
