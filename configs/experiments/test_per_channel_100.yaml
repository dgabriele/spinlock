version: "1.0"

metadata:
  name: "test_per_channel_100"
  description: "Test dataset with per-channel independent IC generation (100 samples)"
  author: "spinlock"
  created: "2026-01-30"

parameter_space:
  architecture:
    num_layers:
      type: "integer"
      bounds: [2, 5]
      description: "Number of convolutional layers"

    channels_per_layer:
      type: "integer"
      bounds: [16, 64]
      description: "Number of channels per layer"

    kernel_size:
      type: "choice"
      choices: [3, 5, 7]
      description: "Convolution kernel size"

  stochastic:
    dropout_rate:
      type: "continuous"
      bounds: [0.0, 0.3]
      description: "Dropout probability"

  operator:
    activation:
      type: "choice"
      choices: ["relu", "gelu", "tanh"]
      description: "Activation function"

  evolution:
    num_timesteps:
      type: "integer"
      bounds: [1, 10]
      description: "Number of evolution timesteps"

    spatial_correlation:
      type: "continuous"
      bounds: [0.0, 0.3]
      description: "Spatial correlation strength"

sampling:
  total_samples: 100
  batch_size: 100

simulation:
  device: "cuda"
  num_realizations: 10
  num_timesteps: 1
  extract_operator_features: false  # Disable feature extraction

  input_generation:
    method: "per_channel"  # NEW: Per-channel independent IC generation
    num_samples_per_operator: 1
    spatial_size: "from_operator"

    # Per-channel configurations
    channel_configs:
      channel_0:  # Density field - fine-grained features
        ic_type_weights:
          gaussian_random_field: 0.4
          localized: 0.3
          multiscale_grf: 0.3

        gaussian_random_field:
          length_scale: 0.05
          variance: 1.0

        localized:
          num_blobs: 5
          min_width: 3.0
          max_width: 10.0

        multiscale_grf:
          scales: [0.02, 0.04, 0.06]
          variance: 1.0

      channel_1:  # Velocity field - structured patterns
        ic_type_weights:
          structured: 0.5
          gaussian_random_field: 0.5

        structured:
          num_structures: 3
          structure_types: ["vortex", "stripe"]

        gaussian_random_field:
          length_scale: 0.1
          variance: 1.0

      channel_2:  # Auxiliary field - coarse features
        ic_type_weights:
          gaussian_random_field: 0.6
          multiscale_grf: 0.4

        gaussian_random_field:
          length_scale: 0.15
          variance: 0.5

        multiscale_grf:
          scales: [0.20, 0.25, 0.30]
          variance: 0.8

dataset:
  output_path: "datasets/test_per_channel_100.h5"
  storage:
    backend: "hdf5"
    compression: "gzip"
    compression_level: 4
    chunk_size: 100
    store_trajectories: true  # Enable to bypass feature-only mode bug

features:
  temporal:
    enabled: false
  summary:
    enabled: false  # Disabled to avoid pre-existing bug with num_timesteps=1

logging:
  level: "INFO"
  format: "structured"
  output: "stdout"
