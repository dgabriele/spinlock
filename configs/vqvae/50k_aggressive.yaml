# Aggressive VQ-VAE Configuration (50K CNO Dataset, C=3)
#
# Maximum GPU/memory utilization for fastest training
#
# Optimizations vs baseline:
# - Batch size: +100% (1024 vs 512) for 2x fewer batches
# - Model capacity: Same as baseline (512/1024) to preserve compute for batch size
# - Validation: Every 10 epochs to reduce overhead
#
# Expected performance:
# - Training time: ~5 hours (vs 10 hours baseline)
# - GPU utilization: 90-100%
# - Memory utilization: 85-95%

# Dataset
dataset_path: "datasets/cno_50k_3channel_dev.h5"

# Feature Families
families:
  initial:
    encoder: initial_hybrid
    encoder_params:
      manual_dim: 14
      cnn_embedding_dim: 28
      encode_manual: false
      in_channels: 3

  temporal:
    encoder: TemporalCNNEncoder
    encoder_params:
      embedding_dim: 128
      architecture: "resnet1d_3"

# VQ-VAE Architecture - HIGH CAPACITY (same as baseline)
model:
  group_embedding_dim: 512      # Keep baseline to maximize batch size
  group_hidden_dim: 1024        # Keep baseline to maximize batch size

  # Adaptive compression ratios
  compression_ratios: "auto"
  auto_compression_strategy: "balanced"

  levels: []

  # VQ-VAE hyperparameters
  uniform_codebook_init: true
  commitment_cost: 0.15
  use_ema: true
  decay: 0.99
  dropout: 0.3

  # Auxiliary loss weights
  orthogonality_weight: 0.1
  informativeness_weight: 0.12

# Feature Cleaning
feature_cleaning:
  enabled: true
  pre_categorization: false
  variance_threshold: 1e-10
  deduplicate_threshold: 0.99
  use_intelligent_dedup: true
  outlier_method: "percentile"
  percentile_range: [0.5, 99.5]

# Training
training:
  batch_size: 1024              # +100% from 512 (AGGRESSIVE)
  learning_rate: 0.001
  num_epochs: 700
  optimizer: "adam"
  scheduler: null
  warmup_epochs: 100

  # Category discovery
  category_assignment: "auto"
  num_categories_auto: null
  orthogonality_target: 0.15
  min_features_per_category: 3

  # Category assignment configuration
  category_assignment_config:
    method: "clustering"
    isolated_families: []
    reassign_orphans: true
    gradient_epochs: 500
    gradient_lr: 0.01
    subsample_excess_fraction: 0.1
    device: "cuda"

    per_family_clustering: true
    per_family_params:
      initial:
        min_clusters: 2
        max_clusters: 5
      temporal:
        min_clusters: 2
        max_clusters: 20

  # Loss weights
  reconstruction_weight: 1.0
  vq_weight: 1.0
  orthogonality_weight: 0.11
  informativeness_weight: 0.12
  topo_weight: 0.3
  topo_samples: 1024
  entropy_weight: 0.1

  # Checkpointing
  save_every: 25
  checkpoint_dir: "checkpoints/vqvae/50k_aggressive"

  # Callbacks
  early_stopping_patience: 100
  early_stopping_min_delta: 0.01

  # Dead code resets - DISABLED
  dead_code_reset_interval: 0
  dead_code_threshold: 5.0
  dead_code_max_reset_fraction: 0.0

  # Validation - OPTIMIZED
  val_every_n_epochs: 10

  # Performance
  use_torch_compile: true

# Logging
logging:
  wandb: false
  log_interval: 100
  eval_interval: 500
  verbose: true

# Random seed
random_seed: 42

# Expected Performance:
# - Training time: ~5 hours (44 batches/epoch vs 88 baseline)
# - 50% speedup from doubled batch size
# - GPU utilization: 90-100%
# - Memory utilization: 85-95%
