# Production Training: INITIAL + TEMPORAL (50K CNO Dataset)
# Based on 100k_full_features.yaml settings
# Training VQ-VAE on ground truth CNO features for stable token space

# Dataset
dataset_path: "datasets/cno_50k_v3_1.h5"

# Feature Families - INITIAL + TEMPORAL (no SUMMARY)
families:
  initial:
    encoder: initial_hybrid
    encoder_params:
      manual_dim: 14
      cnn_embedding_dim: 28
      encode_manual: false
      in_channels: 1

  temporal:
    encoder: TemporalCNNEncoder
    encoder_params:
      embedding_dim: 128
      architecture: "resnet1d_3"

# VQ-VAE Architecture
model:
  group_embedding_dim: 256
  group_hidden_dim: 512
  levels: []
  compression_ratios: "auto"
  auto_compression_strategy: "balanced"
  uniform_codebook_init: true
  commitment_cost: 0.35
  use_ema: true
  decay: 0.99
  dropout: 0.1
  orthogonality_weight: 0.1
  informativeness_weight: 0.12

# Training
training:
  batch_size: 1024
  learning_rate: 0.001
  num_epochs: 550
  optimizer: "adam"
  scheduler: null
  warmup_epochs: 0

  category_assignment: "auto"
  num_categories_auto: null
  orthogonality_target: 0.15
  min_features_per_category: 3
  max_clusters: 25

  category_assignment_config:
    method: "clustering"
    isolated_families: []
    reassign_orphans: true
    gradient_epochs: 500
    gradient_lr: 0.01
    subsample_excess_fraction: 0.1
    device: "cuda"

  reconstruction_weight: 1.0
  vq_weight: 1.0
  orthogonality_weight: 0.1
  informativeness_weight: 0.1
  topo_weight: 0.3
  topo_samples: 1024

  save_every: 25
  checkpoint_dir: "checkpoints/vqvae/production/50k_initial_temporal"

  early_stopping_patience: 100
  early_stopping_min_delta: 0.01

  dead_code_reset_interval: 0
  dead_code_threshold: 5.0
  dead_code_max_reset_fraction: 0.0

  val_every_n_epochs: 5
  use_torch_compile: true

# Logging
logging:
  wandb: false
  log_interval: 100
  eval_interval: 500
  verbose: true

# Random seed
random_seed: 42
