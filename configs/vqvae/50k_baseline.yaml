# Baseline VQ-VAE Configuration (50K CNO Dataset)
#
# Multi-channel (3 channels) with optimized initial feature encoding:
# - Initial features: 256D CNN-only (no BatchNorm, preserves variance)
#   - When manual features enabled: 66D statistical (distributional + spatial + energy)
# - Temporal features: 306D (PyramidEncoder, cleaned)
# - Total input: ~562D (256 CNN + 306 temporal) or ~372D (66 statistical + 306 temporal)
# - VQ-VAE: 768D embedding, 3072D hidden (1.5x capacity, 8GB GPU optimized)
#
# Note: Dimensions are computed automatically from feature pipeline.
# The framework dynamically detects in_channels and computes feature dims.
#
# Changes from previous version:
# - Disabled BatchNorm in CNN encoder to preserve variance (CRITICAL fix)
# - Enabled statistical IC features option (distributional, spatial, energy)
# - Statistical features preserve natural variance vs pattern-complexity features
# - Currently using CNN-only mode (encode_manual: false) for Phase 1 testing

# Dataset
dataset_path: "datasets/50k_baseline.h5"

# Feature Families
families:
  initial:
    encoder: initial_hybrid  # Hybrid: statistical manual (42D) + CNN (256D) = 298D
    encoder_params:
      manual_dim: 42  # Statistical features (distributional + energy, NO spatial)
      cnn_embedding_dim: 256  # CNN embedding dimension
      encode_manual: false  # Pass manual features through directly (no MLP)
      in_channels: 3  # Multi-channel input (C0, C1, C2)
      use_final_batchnorm: true  # Re-enabled for proper normalization
      pretrained_cnn_path: "checkpoints/cnn_pretrain/encoder.pt"  # Pre-trained CNN encoder

  temporal:
    encoder: PyramidTemporalEncoder
    encoder_params:
      architecture: "resnet1d_3"
      level_dims: [32, 64, 96, 128]
      downsample_factors: [1, 2, 4, 8]
      variable_length:
        enabled: true
        min_timesteps: 16
        max_timesteps: 256
        length_bins: [16, 32, 64, 128, 256]
        sampling_strategy: "fixed_bins"
        adaptive_pyramid: true
        min_pyramid_length: 1
        mask_downsample_method: "ceil"

# VQ-VAE Architecture
model:
  group_embedding_dim: 512   # Baseline for 8GB GPU
  group_hidden_dim: 2048     # Baseline

  # Adaptive compression ratios
  compression_ratios: "auto"
  auto_compression_strategy: "balanced"

  # Levels
  levels: []

  # VQ-VAE hyperparameters
  uniform_codebook_init: true
  commitment_cost: 0.1
  use_ema: true
  decay: 0.99
  dropout: 0.35

  # Auxiliary loss weights
  orthogonality_weight: 0.0
  informativeness_weight: 0.0

# Feature Cleaning
feature_cleaning:
  enabled: true
  pre_categorization: true
  variance_threshold: 1e-10
  deduplicate_threshold: 0.99
  use_intelligent_dedup: true
  outlier_method: "percentile"  # Re-enabled - CNN variance preserved by removing BatchNorm
  percentile_range: [0.5, 99.5]

# Normalization Strategy
# CRITICAL: Controls how feature normalization stats are computed
# - per_category_normalization: Compute mean/std separately per category (default: true)
# - global_normalization: Compute mean/std on ALL features before clustering (default: false)
#   Currently using global to preserve natural variance differences between features
# Note: CNN BatchNorm removed to preserve variance during category discovery
normalization_method: "standard"  # "standard" (mean/std) or "mad" (median/MAD)
per_category_normalization: true   # Normalize within each category
global_normalization: false        # Use per-category normalization

# Training
training:
  batch_size: 256  # Reduced to 256 to fit in GPU memory with torch.compile
  learning_rate: 0.001
  num_epochs: 700
  optimizer: "adam"
  scheduler:
    type: "cosine"
    T_max: 1000
    eta_min: 0.0001
  warmup_epochs: 20

  # Category discovery (learnable mode)
  category_assignment: "learnable"
  num_categories_auto: null
  orthogonality_target: 0.15
  min_features_per_category: 3

  # Learnable assignment configuration
  learnable_assignment:
    init_method: "clustering"
    temperature_start: 1.0
    temperature_end: 0.1
    temperature_schedule: "linear"
    assignment_lr: 0.001
    freeze_after_epochs: null
    orthogonality_weight: 0.0
    balance_weight: 0.05
    family_constraint_weight: 1.0

  # Category assignment configuration
  category_assignment_config:
    method: "clustering"
    isolated_families: []
    reassign_orphans: true
    split_mega_categories: true
    max_split_recursion_depth: 5
    max_clusters_for_split: 12
    max_category_size: 40
    subsample_excess_fraction: 0.1
    device: "cuda"

    # Clustering parameters
    linkage_method: "ward"
    distance_metric: "correlation"
    k_selection_method: "silhouette"
    gap_statistic_refs: 10
    export_dendrogram: true
    dendrogram_path: "diagnostics/dendrograms/50k_baseline"

    # Per-family clustering - cluster each family independently
    per_family_clustering: true
    per_family_params:
      initial:
        min_clusters: 2
        max_clusters: 12
      temporal_p0:
        min_clusters: 2
        max_clusters: 10
      temporal_p1:
        min_clusters: 2
        max_clusters: 15
      temporal_p2:
        min_clusters: 2
        max_clusters: 25
      temporal_p3:
        min_clusters: 2
        max_clusters: 35

  # Loss weights
  reconstruction_weight: 1.0
  vq_weight: 0.8
  orthogonality_weight: 0.0
  informativeness_weight: 0.0
  topo_weight: 0.3
  topo_samples: 512  # Reduced proportionally with batch_size
  entropy_weight: 0.05
  category_reconstruction_weight: 0.15
  normalize_mse: true

  # Checkpointing
  save_every: 25
  checkpoint_dir: "checkpoints/vqvae/50k_baseline"

  # Callbacks
  early_stopping_patience: 200
  early_stopping_min_delta: 0.01

  # Dead code resets
  dead_code_reset_interval: 50
  dead_code_threshold: 5.0
  dead_code_max_reset_fraction: 0.05

  # Validation
  val_every_n_epochs: 5

  # Performance
  use_torch_compile: true

  # Data loading
  encode_chunk_size: 5000
  hdf5_chunk_size: "auto"

# Logging
logging:
  wandb: false
  log_interval: 100
  eval_interval: 500
  verbose: true

# Random seed
random_seed: 42
