# VQ-VAE Training Config for MNO Distribution with Reference Feature Regularization
#
# Trains categorical hierarchical VQ-VAE on features extracted from MNO rollouts
# with reference feature regularization to guide toward physics consistency.
#
# This config enables balanced regularization against reference solver (CNO) features,
# particularly for interpolated parameter points where MNO may deviate from ground truth.
#
# Architecture Philosophy:
# - MNO defines the primary distribution (trained for physics accuracy)
# - VQ-VAE learns to tokenize what MNO produces (primary objective)
# - Reference regularization provides gentle physics guidance (secondary objective)
# - Alignment by construction with physics correction
#
# Usage:
#   1. Train MNO with IC reconstruction (Stage 1)
#   2. Generate 10K MNO features with metadata:
#      spinlock generate-noa-dataset \
#        --noa-checkpoint checkpoints/noa/pure_mse_v3_ic_fix/meta_operator_best.pt \
#        --output datasets/noa_features/mno_v3_10k.h5 \
#        --n-samples 10000 \
#        --config configs/experiments/local_100k_optimized.yaml \
#        --batch-size 8
#   3. Extract reference features with IC/param matching:
#      python scripts/extract_reference_features.py \
#        --mno-dataset datasets/noa_features/mno_v3_10k.h5 \
#        --reference-dataset datasets/local_100k_optimized.h5 \
#        --config configs/experiments/local_100k_optimized.yaml \
#        --device cuda
#   4. Train VQ-VAE with reference regularization:
#      spinlock train-vqvae --config configs/vqvae/noa_distribution_10k_with_reference_reg.yaml

# Dataset (generated from MNO with reference features)
dataset_path: "datasets/noa_features/mno_v3_10k.h5"

# Feature Families (based on production/100k_full_features.yaml)
families:
  initial:
    encoder: initial_hybrid
    encoder_params:
      # Hybrid INITIAL encoder: manual features (14D) + CNN trained end-to-end (28D)
      manual_dim: 14
      cnn_embedding_dim: 28
      encode_manual: false  # Pass manual features through directly
      in_channels: 1

  summary:
    encoder: MLPEncoder
    encoder_params:
      hidden_dims: [512, 256]
      output_dim: 128
      dropout: 0.1
      activation: "relu"
      batch_norm: true

  temporal:
    encoder: TemporalCNNEncoder
    encoder_params:
      embedding_dim: 128
      architecture: "resnet1d_3"

# VQ-VAE Architecture
model:
  group_embedding_dim: 256
  group_hidden_dim: 512

  # Hierarchical levels (empty for autoscaling)
  levels: []

  # Adaptive compression ratios
  compression_ratios: "auto"
  auto_compression_strategy: "balanced"

  # VQ-VAE hyperparameters
  uniform_codebook_init: true
  commitment_cost: 0.35
  use_ema: true
  decay: 0.99
  dropout: 0.1

  # Auxiliary loss weights
  orthogonality_weight: 0.1
  informativeness_weight: 0.12

# Training
training:
  batch_size: 1024
  learning_rate: 0.0007
  num_epochs: 550  # Extended for regularization warmup
  optimizer: "adam"
  scheduler: null
  warmup_epochs: 0

  # Category assignment - AUTOMATIC via clustering
  category_assignment: "auto"
  num_categories_auto: null
  orthogonality_target: 0.15
  min_features_per_category: 3
  max_clusters: 25

  # Category assignment configuration
  category_assignment_config:
    method: "clustering"
    isolated_families: []
    reassign_orphans: true
    gradient_epochs: 500
    gradient_lr: 0.01
    subsample_excess_fraction: 0.1
    device: "cuda"

  # Loss weights
  reconstruction_weight: 1.0
  vq_weight: 1.0
  orthogonality_weight: 0.1
  informativeness_weight: 0.1
  topo_weight: 0.3
  topo_samples: 1024

  # Checkpointing
  save_every: 25
  checkpoint_dir: "checkpoints/vqvae/mno_10k_with_reference_reg"

  # Callbacks
  early_stopping_patience: 100
  early_stopping_min_delta: 0.01

  # Dead code resets - DISABLED for small codebooks with uniform init
  dead_code_reset_interval: 0  # 0 = disabled
  dead_code_threshold: 5.0
  dead_code_max_reset_fraction: 0.0

  # Validation
  val_every_n_epochs: 5

  # Performance
  use_torch_compile: true

# Reference Feature Regularization (NEW)
# Regularizes VQ-VAE reconstruction against reference solver features
reference_regularization:
  # Enable reference feature regularization
  # Compares MNO SUMMARY (330D) vs CNO reference SUMMARY (330D) in raw space
  enabled: true  # Now testing with reference regularization

  # Regularization weight (adjusted for raw SUMMARY feature scale ~760K MSE)
  # Target: ref_reg contribution ~0.01-0.05 (comparable to other auxiliary losses)
  # 760K MSE × 1e-7 = 0.076 contribution
  weight: 0.0000001  # 1e-7

  # Apply only to interpolated points (recommended)
  # MNO trained on 2K exact points, generates 10K with 8K interpolated
  # Regularization focuses on points where MNO generalizes beyond training
  interpolated_only: true

  # Warmup schedule (optional)
  # Gradually increase regularization weight from 0 to target over warmup_epochs
  # Allows VQ-VAE to learn MNO distribution first, then refine toward physics
  warmup_epochs: 50

  # Reference dataset path (optional)
  # If null, loads from 'features/reference_features' in training dataset HDF5
  # This should be set during feature extraction via extract_reference_features.py
  reference_dataset_path: null

# Logging
logging:
  wandb: false
  log_interval: 100
  eval_interval: 500
  verbose: true

# Random seed
random_seed: 42

# Expected Performance:
# - Reconstruction loss: < 0.05 (similar to baseline due to low regularization weight)
# - Codebook utilization: > 90% per level (maintained vs baseline)
# - Category separation: orthogonality < 0.15
# - Reference regularization loss: Should decrease over training
# - Physics consistency: Lower MSE to reference features on interpolated validation samples
# - Training time: ~3-4 hours on RTX 3060 Ti (<1% overhead from regularization)
