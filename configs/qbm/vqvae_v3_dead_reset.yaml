# VQ Tokenizer - Dead Code Reset Configuration (v3)
#
# Based on v2.1 (vqvae_diverse_v2_regularized.yaml), with dead code reset
# activated. The v2.1 regularization addressed train/val divergence; this
# config adds active codebook maintenance so collapsed categories recover.
#
# Key changes from v2.1:
#   dead_code_reset_interval: 999999 → 5   (reset every 5 epochs)
#   dead_code_threshold:      0.0    → 0.01 (codes < 1% usage = dead)
#
# Reasoning:
#   - EMA decay=0.99 with ~59 batches/epoch → EMA is 95% settled by epoch 5
#   - threshold=0.01 catches codes used <1% of the time (well below 1/n_codes
#     fair share of ~3-10%), while leaving all genuinely active codes untouched
#   - Reset copies nearest live embedding + noise(std=0.01), giving dead codes
#     a slightly-perturbed position near the live centroid so they can compete
#     for nearby encoder outputs that the live code currently monopolises

dataset_path: "datasets/qbm_50k.h5"

# ═══════════════════════════════════════════════════════════════
# Encoder Configuration
# ═══════════════════════════════════════════════════════════════

encoder:
  initial:
    variant: "hybrid"
    cnn_embedding_dim: 384
    pretrained_cnn_path: null
    use_final_batchnorm: true
    encode_manual: true

  temporal:
    variant: "pyramid"
    level_dims: [32, 64, 96, 128]
    downsample_factors: [1, 2, 4, 8]
    variable_length:
      enabled: true
      min_timesteps: 32
      max_timesteps: 256
      length_bins: [32, 64, 128, 256]
      sampling_strategy: "fixed_bins"
      adaptive_pyramid: true
      min_pyramid_length: 1
      mask_downsample_method: "ceil"

  theta:
    variant: "mlp"
    hidden_dim: 64
    output_dim: 32
    dropout: 0.25
    use_layer_norm: true

  embedding_dim: 64
  hidden_dim: 128
  dropout: 0.5
  use_layer_norm: true

# ═══════════════════════════════════════════════════════════════
# Quantizer
# ═══════════════════════════════════════════════════════════════

quantizer:
  embedding_dim: 64
  commitment_cost: 0.25
  use_ema: true
  ema_decay: 0.99
  epsilon: 1.0e-5

# ═══════════════════════════════════════════════════════════════
# Hierarchy
# ═══════════════════════════════════════════════════════════════

hierarchy:
  num_levels: 3
  compression_ratios: "0.5:1.0:1.5"
  min_latent_dim: 4
  max_latent_dim: 192

# ═══════════════════════════════════════════════════════════════
# Feature Cleaning
# ═══════════════════════════════════════════════════════════════

feature_cleaning:
  enabled: true
  pre_categorization: true
  variance_threshold: 1.0e-8
  deduplicate_threshold: 0.99
  use_intelligent_dedup: true
  outlier_method: "percentile"
  percentile_range: [0.5, 99.5]

# ═══════════════════════════════════════════════════════════════
# Grouping
# ═══════════════════════════════════════════════════════════════

grouping:
  preprocessing:
    method: "mad"
    clip_outliers: false

  clustering:
    linkage_method: "ward"
    distance_metric: "correlation"
    k_selection_method: "silhouette"
    min_groups: 8
    max_groups: 20
    use_gpu: true

  gradient:
    num_epochs: 500
    learning_rate: 0.01
    temperature_start: 1.0
    temperature_end: 0.5
    orthogonality_weight: 1.0
    informativeness_weight: 1.0
    orthogonality_target: 0.15
    device: "auto"

  splitting:
    enabled: false

  skip_gradient_refinement: false
  random_seed: 42

# ═══════════════════════════════════════════════════════════════
# Inverse Heads
# ═══════════════════════════════════════════════════════════════

inverse_heads:
  theta_hidden_dim: 128
  theta_dropout: 0.15
  initial_base_channels: 256

# ═══════════════════════════════════════════════════════════════
# Training - DEAD CODE RESET ENABLED
# ═══════════════════════════════════════════════════════════════

training:
  num_epochs: 1000
  batch_size: 768
  learning_rate: 0.001
  val_split: 0.1
  val_every_n_epochs: 3

  optimizer: "adamw"
  weight_decay: 0.05
  gradient_clip_norm: 1.0

  use_scheduler: true
  scheduler_type: "cosine"
  warmup_epochs: 10

  early_stopping_patience: 30
  early_stopping_min_delta: 0.001

  # ── Dead code reset: ENABLED ──────────────────────────────────
  dead_code_reset_interval: 5    # every 5 epochs (~295 batches; EMA 95% settled)
  dead_code_threshold: 0.01      # codes used < 1% of time are reset

  device: "auto"
  compile_model: false

# ═══════════════════════════════════════════════════════════════
# Loss
# ═══════════════════════════════════════════════════════════════

loss:
  reconstruction_weight: 0.0003
  orthogonality_weight: 0.1
  informativeness_weight: 0.1
  topographic_weight: 0.2
  normalize_reconstruction: true

  roundtrip:
    enabled: true
    weight: 8.0
    theta_weight: 1.0
    initial_weight: 1.0

# ═══════════════════════════════════════════════════════════════
# Normalization
# ═══════════════════════════════════════════════════════════════

normalization:
  method: "none"
  clip_std_multiplier: null

# ═══════════════════════════════════════════════════════════════
# System
# ═══════════════════════════════════════════════════════════════

random_seed: 42
verbose: true
log_level: "INFO"
