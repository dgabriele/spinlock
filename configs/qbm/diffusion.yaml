# QBM (Quantum Brownian Motion) D3PM Discrete Diffusion Configuration
# ═══════════════════════════════════════════════════════════════
#
# Canonical D3PM training config for QBM 50K pretokenized data.
# Includes architecture improvements:
#   - SNR weighting (weight loss by 1/beta_t)
#   - Vocab-size weighting (normalize by log(V)/log(V_max))
#   - Per-category hierarchical guidance (L0 guides only its own family)
#   - Batched timesteps (automatic, no config needed)
#   - Eval-mode attention unmasking (automatic at inference)
#
# Training command:
#   poetry run python experiments/diffusion/scripts/train.py \
#     --config configs/qbm/diffusion.yaml

# Dataset paths
dataset:
  tokenized_path: "datasets/qbm_50k_pretokenized.h5"
  tokenizer_checkpoint: "checkpoints/qbm_tokenizer_50k/vq_tokenizer_best.pt"
  use_pretokenized: true

# Masking strategy
masking:
  strategy: "random"
  mask_probability: 0.5
  seed: 42

# Diffusion schedule
diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule_type: "cosine"
  transition_type: "absorbing"  # mask-token noise model (BERT-style unmask > denoise)
  beta_scaling: "vocab_aware"   # scale beta by log(V)/log(V_max) per category

# Denoising network
model:
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  use_hierarchical_guidance: true
  hierarchical_guidance_weight: 0.1
  hierarchical_guidance_mode: "per_category"  # L0 guides only its own family

# Training
training:
  batch_size: 32
  num_epochs: 100
  num_workers: 0
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0
  use_snr_weighting: true           # Weight loss by 1/beta_t (more signal at low noise)
  use_vocab_size_weighting: true    # Normalize by log(V)/log(V_max) across categories

  # Physics-aware auxiliary loss (soft-decode through frozen tokenizer → MSE)
  physics_loss:
    enabled: true
    weight: 1.0                     # Scale relative to cross-entropy loss
    temperature: 10.0               # High τ spreads soft distribution across codebook
    warmup_epochs: 3                # Let cross-entropy converge first
    families: ["theta"]             # Start with theta only (9D, lightweight)
    theta_weight: 1.0
    initial_weight: 0.0             # Disabled initially (save VRAM, add later)
    timestep_gate: "cosine"         # Downweight at high noise: cos(πt/2T)

  # Learning rate schedule
  lr_scheduler:
    type: "cosine"
    warmup_epochs: 2
    min_lr: 1.0e-6

  # Validation
  val_batch_size: 128
  val_split: 0.1
  val_frequency: 1
  val_samples: 5

  # Checkpointing
  checkpoint_frequency: 5
  save_best: true

  # Logging
  log_frequency: 50
  use_wandb: false

# Output
output:
  dir: "experiments/diffusion/results/qbm"
  checkpoint_prefix: "diffusion_qbm"

# Device
device: "cuda"
seed: 42
