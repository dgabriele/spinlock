# Multi-Channel MNO Training on 50K Baseline Dataset (3-channel)
#
# Location: configs/50k_baseline/mno/baseline.yaml
#
# Architecture:
# - in_channels: 3, out_channels: 3 (3-channel fields)
# - base_channels: 40 (227M params)
# - FiLM conditioning for parameter modulation
# - MSE-LED loss (trajectory + initial condition)
# - BPTT with 32-step windows for memory efficiency
#
# CNO Supervision:
# - CNO operators work with 3 channels
# - All 3 channels supervised by CNO targets
#
# Training on 50K baseline dataset with multi-channel support.

model:
  spatial_dim: 64
  in_channels: 3                # 3-channel input fields
  out_channels: 3               # 3-channel output fields
  base_channels: 40             # 227M parameters
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  param_conditioning: true
  param_dim: 14
  param_embed_dim: 128
  token_conditioning: false

  conditioning_mode: "film"

  film:
    enabled: true
    embed_dim: 128
    hidden_dim: 256
    init_gamma: 1.0
    init_beta: 0.0
    post_norm: true

    modulate_encoder: true
    modulate_decoder: true
    encoder_levels: null
    decoder_levels: null

    modulate_afno_post: false
    afno_blocks: null

training:
  n_samples: 20000              # Lean dataset for strong generalization
  sampling_strategy: "sequential"
  batch_size: 2
  gradient_accumulation_steps: 4  # Effective batch size: 8
  epochs: 5                      # 5 epochs for baseline evaluation
  learning_rate: 1.0e-4
  warmup_steps: 2000             # 1 epoch warmup (16000 train / 8 effective batch)
  weight_decay: 1.0e-4
  clip_grad: 1.0

  timesteps: 256
  bptt_window: 32                # Memory-efficient backprop through time

  use_torch_compile: false       # Disabled: BPTT + small batch size + FiLM don't benefit
  replayer_cache_size: 16        # Cache CNO operators (conservative for memory)

  early_stopping_patience: 10

loss:
  mode: "mse_led"
  lambda_traj: 1.0
  lambda_ic: 0.3

data:
  dataset_path: "datasets/50k_baseline.h5"
  config: "configs/50k_baseline/50k_baseline.yaml"
  val_split: 0.2
  num_workers: 8

checkpointing:
  save_dir: "checkpoints/mno/50k_baseline"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42

# Expected performance:
# - 227M parameters (3x channels compared to single-channel baseline)
# - ~2000 batches/epoch (16000 train samples / 8 effective batch)
# - Effective batch size: 8 (2×4 gradient accumulation)
# - LR: 1e-4
# - Target: L_traj < 1.0 (all 3 channels supervised via CNO)
# - Dataset: 20K from 50K baseline (16K train, 4K val with 20% split)
# - Rationale: Lean training for strong generalization, sparse world view refined downstream
