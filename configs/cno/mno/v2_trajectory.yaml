model:
  base_channels: 32
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  dropout: 0.1
  param_conditioning: true
  param_embed_dim: 128
  conditioning_mode: "film"
  film: {enabled: true, embed_dim: 128, hidden_dim: 256}
  update_mode: "residual"
  use_checkpointing: true

training:
  n_samples: 10000
  batch_size: 1
  gradient_accumulation_steps: 8
  epochs: 30
  learning_rate: 2.0e-4
  warmup_steps: 500
  weight_decay: 0.01
  clip_grad: 1.0
  timesteps: 256
  bptt_window: 32
  film_lr_multiplier: 5.0
  replayer_cache_size: 32
  eval_every: 1
  eval_samples: 50

loss:
  lambda_traj: 1.0
  lambda_ic: 0.3
  lambda_contrastive: 0.3
  contrastive:
    temperature: 0.1
    embed_dim: 128
    queue_size: 64

data:
  dataset_path: "datasets/50k_baseline.h5"
  config: "configs/50k_baseline/50k_baseline.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/mno/v2_trajectory"
  save_every: 1
  keep_best: true

device: "cuda"
seed: 42
