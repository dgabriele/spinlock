# MNO Training — Stage 1: Pure Physics
#
# Train on traj + IC MSE only until rel_l2 < ~2.0.
# No tokenization losses — they add noise before the MNO learns basic dynamics.
#
# Once rel_l2 is stable below 2.0, switch to multi_scale_roundtrip.yaml
# (copy checkpoint path there, reduce LR, add roundtrip at lambda ~0.05).

model:
  base_channels: 32              # ~145M params — increased capacity for dual-objective (physics + tokens later)
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  dropout: 0.1

  param_conditioning: true
  param_embed_dim: 128
  conditioning_mode: "film"

  film:
    enabled: true
    embed_dim: 128
    hidden_dim: 256
    init_gamma: 1.0
    init_beta: 0.0
    post_norm: true
    modulate_encoder: true
    modulate_decoder: true

  update_mode: "residual"
  use_checkpointing: true
  checkpoint_every: 16

training:
  n_samples: 10000
  sampling_strategy: "sequential"
  batch_size: 1                      # Reduced for OOM (7GB GPU, ~6GB used by system)
  gradient_accumulation_steps: 8     # Maintains effective batch = 8
  epochs: 30
  learning_rate: 2.0e-4              # Increased for larger model (145M params)
  warmup_steps: 500
  weight_decay: 1.0e-4
  clip_grad: 1.0

  timesteps: 256
  bptt_window: 32

  use_torch_compile: false
  replayer_cache_size: 4
  early_stopping_patience: 10
  film_lr_multiplier: 5.0
  use_amp: false

  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

loss:
  mode: "mse_led_param_sensitive"  # Includes parameter contrastive

  # Weak physics regularizers (keep rollouts plausible, not exact)
  lambda_traj: 0.1                 # WEAK — physical plausibility only, not exact reconstruction
  lambda_ic: 0.1                   # WEAK — IC plausibility only

  # Diversity regularizers - PARAMETER SPECIFICITY
  lambda_contrastive: 0.0          # DISABLED - redundant with token_contrastive
  lambda_param_recon: 2.0          # ENABLED - force rollout to encode params (prevent mode collapse)

  # Contrastive configs
  contrastive:
    temperature: 0.1               # InfoNCE temperature for param contrastive
    queue_size: 64                 # MoCo-style queue for additional negatives (critical for small batches)

  # Parameter reconstruction
  param_recon:
    architecture: "mlp"
    hidden_dim: 256
    num_layers: 3

  multi_scale_roundtrip:
    enabled: true                      # Required for token_contrastive + roundtrip
    pretokenized_path: "datasets/50k_cno_v3_tokenized_temporal_res.h5"
    lambda_roundtrip: 1.0              # PRIMARY — token cycle consistency (tokens → params → CNO → same tokens)
    lambda_feat_mse: 0.0               # NO feature MSE
    lambda_token_contrastive: 5.0      # REDUCED from 80.0 — gradient was exploding (100→850)
    families: ["temporal"]
    token_contrastive:
      nce_temperature: 0.1
      token_temperature: 0.5
      queue_size: 64
      embed_dim: 128
      hidden_dim: 256

data:
  dataset_path: "datasets/50k_baseline.h5"
  config: "configs/experiments/cno_50k_3channel.yaml"
  val_split: 0.1
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

# Tokenizer for token_contrastive
tokenizer:
  checkpoint: "checkpoints/cno/v3/vq_tokenizer_best.pt"

checkpointing:
  save_dir: "checkpoints/mno/cno_pure_physics"
  save_every: 1                              # Save every epoch to prevent data loss
  keep_best: true

device: "cuda"
seed: 42
