# VQ Tokenizer — Learned CNN Temporal Features
#
# Identical to vqtokenizer_v1.yaml EXCEPT:
#   1. feature_source: "learned" — per-frame CNN replaces hand-crafted features
#   2. encoder.initial.variant: "cnn" (no manual features in learned mode)
#   3. encoder.temporal.learned: new CNN config section
#   4. No feature_cleaning (CNN has internal BatchNorm)
#   5. No grouping (sequential slicing of CNN output, automatic)
#   6. training.batch_size: 32 (on-the-fly trajectory generation is expensive)
#   7. cno_config_path: for CNOReplayer trajectory generation
#
# All other settings (loss, quantizer, hierarchy, optimizer, scheduler, etc.)
# are kept identical to v1 for a fair comparison.

dataset_path: "datasets/50k_baseline.h5"

# ── Feature source: learned CNN ──────────────────────────────
feature_source: "learned"
cno_config_path: "configs/50k_baseline/50k_baseline.yaml"
replayer_cache_size: 16

# ═══════════════════════════════════════════════════════════════
# Encoder Configuration
# ═══════════════════════════════════════════════════════════════

encoder:
  initial:
    variant: "cnn"              # CNN-only (no manual features in learned mode)
    cnn_embedding_dim: 384      # Same as v1
    use_final_batchnorm: true
    # in_channels: auto-detected from dataset

  temporal:
    variant: "pyramid"
    learned:
      # in_channels: auto-detected from ICs
      embedding_dim: 240        # 30 groups × 8 dim/group
      num_groups: 30
    level_dims: [6, 12, 20, 26]    # Same as v1: sum=64D per group
    downsample_factors: [1, 2, 4, 8]
    variable_length:
      enabled: true
      min_timesteps: 32
      max_timesteps: 256
      length_bins: [32, 64, 128, 256]
      sampling_strategy: "fixed_bins"
      adaptive_pyramid: true
      min_pyramid_length: 1
      mask_downsample_method: "ceil"

  theta:
    variant: "mlp"
    # param_dim: auto-detected
    hidden_dim: 64
    output_dim: 32
    dropout: 0.25
    use_layer_norm: true

  embedding_dim: 64
  hidden_dim: 128
  dropout: 0.5                  # Same as v1
  use_layer_norm: true

# ═══════════════════════════════════════════════════════════════
# Quantizer
# ═══════════════════════════════════════════════════════════════

quantizer:
  embedding_dim: 64
  commitment_cost: 0.25
  use_ema: true
  ema_decay: 0.99
  epsilon: 1.0e-5

# ═══════════════════════════════════════════════════════════════
# Hierarchy
# ═══════════════════════════════════════════════════════════════

hierarchy:
  num_levels: 3
  compression_ratios: "0.5:1.0:1.5"
  min_latent_dim: 4
  max_latent_dim: 192

# ═══════════════════════════════════════════════════════════════
# Inverse Heads (same as v1)
# ═══════════════════════════════════════════════════════════════

inverse_heads:
  theta_hidden_dim: 128
  theta_dropout: 0.15
  initial_base_channels: 256

# ═══════════════════════════════════════════════════════════════
# Training (same as v1 except batch_size)
# ═══════════════════════════════════════════════════════════════

training:
  num_epochs: 1000
  batch_size: 32                # Smaller due to on-the-fly trajectory generation
  learning_rate: 0.001
  val_split: 0.1
  val_every_n_epochs: 3

  optimizer: "adamw"
  weight_decay: 0.05
  gradient_clip_norm: 1.0

  use_scheduler: true
  scheduler_type: "cosine"
  warmup_epochs: 10

  early_stopping_patience: 30
  early_stopping_min_delta: 0.001

  dead_code_reset_interval: 0
  dead_code_threshold: 0.01

  device: "auto"
  compile_model: false

# ═══════════════════════════════════════════════════════════════
# Loss (same as v1)
# ═══════════════════════════════════════════════════════════════

loss:
  reconstruction_weight: 0.0003
  orthogonality_weight: 0.1
  informativeness_weight: 0.1
  topographic_weight: 0.2
  topographic_n_samples: 8     # 25% of batch_size=32 (v1 used 64/256=25%)
  normalize_reconstruction: true

  roundtrip:
    enabled: true
    weight: 8.0
    theta_weight: 1.0
    initial_weight: 1.0

# ═══════════════════════════════════════════════════════════════
# Normalization (same as v1)
# ═══════════════════════════════════════════════════════════════

normalization:
  method: "none"
  clip_std_multiplier: null

# ═══════════════════════════════════════════════════════════════
# System (same as v1)
# ═══════════════════════════════════════════════════════════════

random_seed: 42
verbose: true
log_level: "INFO"
