# VQ Tokenizer — Temporal-Only Mode (Behavioral Focus)
#
# Produces 90 BEHAVIORAL tokens (30 groups × 3 levels) from trajectory dynamics.
# Tokens are grounded symbols representing what the system DOES, not what
# parameters generated it. Optimized for behavioral discriminability:
# different dynamics → different token sets, same dynamics → same tokens.
#
# Architecture:
#   Raw trajectory → CNN → 30 per-group pyramid encoders → 90 VQ tokens
#   Quantized latents → ic_aux_head → [B, C, H, W] ICs (behavioral consistency)
#
# Loss design:
#   - VQ commitment: codebook quality
#   - Topographic: distance preservation (behavioral discriminability)
#   - Orthogonality: decorrelated group representations
#   - Informativeness: prevent group collapse
#   - IC aux: spatial grounding (IC is the observable starting state)
#   - Reconstruction: tokens must preserve encoded behavioral content

dataset_path: "datasets/50k_baseline.h5"

# ── Feature source: learned CNN ──────────────────────────────
feature_source: "learned"
cno_config_path: "configs/50k_baseline/50k_baseline.yaml"
replayer_cache_size: 16

# ═══════════════════════════════════════════════════════════════
# Encoder Configuration
# ═══════════════════════════════════════════════════════════════

encoder:
  initial:
    variant: "cnn"
    cnn_embedding_dim: 384
    use_final_batchnorm: true
    # in_channels: auto-detected from dataset

  temporal:
    variant: "pyramid"
    learned:
      # in_channels: auto-detected from ICs
      embedding_dim: 240        # 30 groups × 8 dim/group
      num_groups: 30
    level_dims: [6, 12, 20, 26]    # sum=64D per group
    downsample_factors: [1, 2, 4, 8]
    variable_length:
      enabled: true
      min_timesteps: 32
      max_timesteps: 256
      length_bins: [32, 64, 128, 256]
      sampling_strategy: "fixed_bins"
      adaptive_pyramid: true
      min_pyramid_length: 1
      mask_downsample_method: "ceil"

  # Theta config kept for param_dim auto-detection (dimensions only)
  theta:
    variant: "direct"
    # param_dim: auto-detected from dataset

  embedding_dim: 64
  hidden_dim: 128
  dropout: 0.5
  use_layer_norm: true

# ═══════════════════════════════════════════════════════════════
# Auxiliary Heads — IC decoded from temporal tokens
# ═══════════════════════════════════════════════════════════════

aux_heads:
  # Theta: DISABLED — most params are "dark" (unobservable in dynamics).
  # Forcing tokens to predict dark params dilutes behavioral signal.
  theta_enabled: false
  theta_probe_enabled: false

  # IC: ENABLED — the initial condition IS observable behavior (t=0 state).
  # Predicting IC from temporal tokens is a valid behavioral consistency check.
  initial_enabled: true
  initial_base_channels: 256
  initial_weight: 1.0            # primary behavioral grounding signal

  # Pre-VQ IC probe: bypasses VQ bottleneck for direct CNN → IC gradient.
  initial_probe_enabled: true
  initial_probe_weight: 1.0

# ═══════════════════════════════════════════════════════════════
# Quantizer
# ═══════════════════════════════════════════════════════════════

quantizer:
  embedding_dim: 64
  commitment_cost: 0.25
  use_ema: true
  ema_decay: 0.99
  epsilon: 1.0e-5

# ═══════════════════════════════════════════════════════════════
# Hierarchy
# ═══════════════════════════════════════════════════════════════

hierarchy:
  num_levels: 3
  compression_ratios: "0.5:1.0:1.5"
  min_latent_dim: 4
  max_latent_dim: 192

# ═══════════════════════════════════════════════════════════════
# Training
# ═══════════════════════════════════════════════════════════════

training:
  num_epochs: 1000
  batch_size: 128
  learning_rate: 0.001
  val_split: 0.1
  val_every_n_epochs: 1

  optimizer: "adamw"
  weight_decay: 0.05
  gradient_clip_norm: 1.0

  use_scheduler: true
  scheduler_type: "cosine"
  warmup_epochs: 10

  early_stopping_patience: 30
  early_stopping_min_delta: 0.001

  dead_code_reset_interval: 0
  dead_code_threshold: 0.01

  device: "auto"
  compile_model: false

# ═══════════════════════════════════════════════════════════════
# Loss — Behavioral Discriminability
# ═══════════════════════════════════════════════════════════════

loss:
  reconstruction_weight: 0.1     # tokens must preserve encoded behavioral content
  orthogonality_weight: 0.1      # decorrelated group representations
  informativeness_weight: 0.1    # prevent group collapse
  informativeness_mode: "log_barrier"
  topographic_weight: 0.5        # KEY: distance preservation = behavioral discriminability
  topographic_n_samples: 128
  normalize_reconstruction: true
  normalize_loss_scales: true
  loss_scale_ema_momentum: 0.99

# ═══════════════════════════════════════════════════════════════
# Normalization
# ═══════════════════════════════════════════════════════════════

normalization:
  method: "none"
  clip_std_multiplier: null

# ═══════════════════════════════════════════════════════════════
# System
# ═══════════════════════════════════════════════════════════════

random_seed: 42
verbose: true
log_level: "INFO"
