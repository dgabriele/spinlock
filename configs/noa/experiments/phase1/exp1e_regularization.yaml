# Experiment 1E: Stronger Regularization
# Tests if stronger weight decay and softer gradient clipping improve generalization

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 32
  encoder_levels: 3
  modes: 16
  afno_blocks: 4

training:
  n_samples: 100
  batch_size: 4
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4  # CHANGE: 1e-6 → 1e-4 (100x stronger)
  clip_grad: 0.5  # CHANGE: 1.0 → 0.5 (softer clipping)
  timesteps: 32
  early_stopping_patience: 5

loss:
  lambda_traj: 1.0

data:
  dataset_path: "datasets/100k_full_features.h5"
  config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/experiments/exp1e_regularization"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42
