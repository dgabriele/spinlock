# Experiment 1F: Combined Best (Low Memory Version)
# Combines high-impact improvements WITHOUT capacity increase to fit in 8GB GPU
# warmup + grad_accum + conditional cache + regularization

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 32  # KEEP at 32 (not 48) to avoid OOM
  encoder_levels: 3
  modes: 16  # KEEP at 16 (not 32) to avoid OOM
  afno_blocks: 4  # KEEP at 4 (not 6) to avoid OOM

training:
  n_samples: 100
  batch_size: 4
  gradient_accumulation_steps: 8  # CHANGE: Effective BS=32 (from 1B)
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4  # CHANGE: 1e-6 → 1e-4 (from 1E)
  clip_grad: 0.5  # CHANGE: 1.0 → 0.5 (from 1E)
  timesteps: 32
  warmup_steps: 500  # CHANGE: Add warmup (from 1A)
  early_stopping_patience: 5  # CHANGE: Add early stopping

loss:
  lambda_traj: 1.0

data:
  dataset_path: "datasets/100k_full_features.h5"
  cno_config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/experiments/exp1f_combined_lowmem"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42
