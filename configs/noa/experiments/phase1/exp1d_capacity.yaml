# Experiment 1D: Increased Model Capacity
# Tests if the model is underfitting by increasing modes, blocks, and channels

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 48  # CHANGE: 32 → 48 (50% wider)
  encoder_levels: 3
  modes: 32  # CHANGE: 16 → 32 (2x Fourier modes)
  afno_blocks: 6  # CHANGE: 4 → 6 (50% more depth)

training:
  n_samples: 100
  batch_size: 4
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6
  clip_grad: 1.0
  timesteps: 32
  early_stopping_patience: 5

loss:
  lambda_traj: 1.0

data:
  dataset_path: "datasets/100k_full_features.h5"
  config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/experiments/exp1d_capacity"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42
