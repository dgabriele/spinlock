# Pure MSE Training: Quick Validation Test (100 samples)
#
# This is a test config to validate the pure MSE training pipeline works
# before running the full 1000-sample, 30-epoch training.

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 40              # 226M params (same as exp2f)
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  token_conditioning: false      # DISABLED - no token complexity

training:
  n_samples: 100                 # Small test set for validation
  batch_size: 2
  epochs: 3                      # Just a few epochs to verify convergence starts
  learning_rate: 5.0e-5          # Proven stable from exp2f
  warmup_steps: 75               # 0.5 epochs (150 steps / 2)
  weight_decay: 1.0e-4
  clip_grad: 0.5

  # Truncated BPTT (proven effective)
  timesteps: 256                 # Full rollout
  bptt_window: 32                # Backprop window

  early_stopping_patience: 5

loss:
  # Pure MSE - simple, proven, stable
  mode: "mse_led"
  lambda_traj: 1.0               # Only objective!

data:
  dataset_path: "datasets/100k_full_features.h5"
  cno_config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/noa/pure_mse_test"
  save_every: 1
  keep_best: true

device: "cuda"
seed: 42

# Test target: Verify training starts and loss decreases
