# Experiment 2E: Token-Conditioned MNO with Stable Training + Increased Capacity
# - Stable LR: 5e-5 with 5-epoch warmup
# - Increased capacity: 48 base_channels (vs 32 baseline)
# - Token conditioning with real oracle tokens
# Goal: Achieve <0.3 MSE with tokens + stability + capacity

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 40          # INCREASED from 32 (~1.9x more params, fits in 8GB GPU)
  encoder_levels: 3
  modes: 16
  afno_blocks: 4

  # Token conditioning (with runtime parameter detection)
  token_conditioning: true
  token_embed_dim: 64
  vqvae_checkpoint: "checkpoints/production/100k_full_features/best_model.pt"

training:
  n_samples: 1000
  batch_size: 2              # Balanced for ~230M params
  epochs: 30
  learning_rate: 5.0e-5      # STABLE: halved from original 1e-4
  warmup_steps: 2250         # 5 epochs × 450 batches (bs=2) = warmup
  weight_decay: 1.0e-4       # From Phase 1 winner
  clip_grad: 0.5
  timesteps: 32
  early_stopping_patience: 10

loss:
  lambda_traj: 1.0

data:
  dataset_path: "datasets/100k_full_features.h5"
  oracle_token_path: "datasets/100k_oracle_tokens_1k.h5"
  cno_config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/experiments/phase2/exp2e_token_stable_large"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42
