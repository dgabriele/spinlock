# Experiment 2A: Baseline on 1K samples
# Uses best config from Phase 1 (1E) scaled to 1K samples

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 32  # Standard capacity
  encoder_levels: 3
  modes: 16
  afno_blocks: 4

training:
  n_samples: 1000    # 10x larger than Phase 1
  batch_size: 4
  epochs: 30         # More epochs for larger dataset
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4   # From 1E
  clip_grad: 0.5         # From 1E
  timesteps: 32
  early_stopping_patience: 10

loss:
  lambda_traj: 1.0

data:
  dataset_path: "datasets/100k_full_features.h5"
  cno_config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/experiments/phase2/exp2a_baseline_1k"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42
