# MNO (Meta Neural Operator) Training Configuration - 10K v3.0
# Stage 1: Train MNO on pure physics (trajectory matching) with v3.0 CNO data

# Model architecture
model:
  spatial_dim: 64
  in_channels: 3       # Updated to match CNO dataset (3 channels)
  out_channels: 3      # Updated to match CNO dataset
  base_channels: 32
  encoder_levels: 3
  modes: 16
  afno_blocks: 4

# Training hyperparameters
training:
  n_samples: 10000     # Use all 10K samples
  batch_size: 8        # Adjust based on GPU memory
  epochs: 100          # More epochs for 10k dataset
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6
  clip_grad: 1.0
  timesteps: 256       # Match CNO dataset (256 timesteps)

# Loss configuration (pure physics - trajectory MSE)
loss:
  lambda_traj: 1.0
  # Optional instrumental regularizers (future)
  lambda_smoothness: 0.0
  lambda_energy: 0.0

# Data configuration
data:
  dataset_path: "datasets/cno_10k_v3_with_trajectories.h5"
  val_split: 0.1
  num_workers: 4

  # CNO config reference (for validation/testing)
  cno_config: "configs/experiments/cno_10k_v3_with_trajectories.yaml"

# Checkpointing
checkpointing:
  save_dir: "checkpoints/mno_10k_v3"
  save_every: 10  # Save checkpoint every 10 epochs
  keep_best: true  # Keep best checkpoint (lowest validation loss)

# Device and seed
device: "cuda"
seed: 42

# Training notes:
# - This config trains MNO on 10K CNO-generated trajectories with v3.0 features
# - Model learns to approximate the CNO forward operator
# - Trajectories must be present in dataset (store_trajectories=true)
# - After training, MNO can generate rollouts for downstream tasks
