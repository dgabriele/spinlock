# Experiment 1F: Combined Best
# Combines all high-impact improvements: warmup + grad_accum + capacity + regularization
# CRITICAL: This becomes the baseline for Phase 2 if successful

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 48  # CHANGE: 32 → 48 (from 1D)
  encoder_levels: 3
  modes: 32  # CHANGE: 16 → 32 (from 1D)
  afno_blocks: 6  # CHANGE: 4 → 6 (from 1D)

training:
  n_samples: 100
  batch_size: 4
  gradient_accumulation_steps: 8  # CHANGE: Effective BS=32 (from 1B)
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4  # CHANGE: 1e-6 → 1e-4 (from 1E)
  clip_grad: 0.5  # CHANGE: 1.0 → 0.5 (from 1E)
  timesteps: 32
  warmup_steps: 500  # CHANGE: Add warmup (from 1A)
  early_stopping_patience: 5  # CHANGE: Add early stopping

loss:
  lambda_traj: 1.0

data:
  dataset_path: "datasets/100k_full_features.h5"
  config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/experiments/exp1f_combined"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42
