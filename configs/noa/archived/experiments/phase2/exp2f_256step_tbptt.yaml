# Experiment 2F: Token-Conditioned MNO with 256-Step Training + Truncated BPTT
# - Full-horizon rollouts matching dataset generation (256 steps)
# - Truncated BPTT with 32-step backprop window (prevents gradient explosion)
# - Token conditioning with real oracle tokens
# - Stable training: 5e-5 LR with 5-epoch warmup
# - Increased capacity: 40 base_channels (226M params)
# Goal: Learn long-horizon dynamics, achieve <0.3 MSE

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 40          # INCREASED from 32 (~1.9x more params, fits in 8GB GPU)
  encoder_levels: 3
  modes: 16
  afno_blocks: 4

  # Token conditioning (with runtime parameter detection)
  token_embed_dim: 64
  vqvae_checkpoint: "checkpoints/production/100k_3family_v1/best_model.pt"

training:
  n_samples: 1000
  batch_size: 2              # Reduced for 256-step rollouts with TBPTT
  epochs: 2                  # 2 epochs with early stopping at traj_loss=1.0
  learning_rate: 5.0e-5      # STABLE: same as exp2e
  warmup_steps: 2250         # 5 epochs × 450 batches (full warmup like exp2e)
  weight_decay: 1.0e-4       # From Phase 1 winner
  clip_grad: 0.5

  # Long-horizon training with truncated BPTT
  timesteps: 256             # FULL rollout length (matches dataset generation)
  bptt_window: 32            # Backprop window (prevents gradient explosion + saves memory)

  early_stopping_patience: 10
  early_stopping_threshold: 1.0  # Stop if traj_loss reaches 1.0

loss:
  lambda_traj: 1.0

data:
  dataset_path: "datasets/100k_full_features.h5"
  ground_truth_token_path: "datasets/100k_ground_truth_tokens_1k.h5"
  config: "configs/experiments/local_100k_optimized.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/experiments/phase2/exp2f_256step_tbptt"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42
