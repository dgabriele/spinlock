# FiLM Modulation Training on 50K v3.1 CNO Dataset (10K samples) - v3 arch
# Same improved architecture as 20K v3, but training on 10K for faster convergence
#
# Architecture from v3:
# - base_channels: 40 (227M params - 1.56x larger than original)
# - LR: 5e-5 (lower for stability)
# - Warmup: 2500 steps (1 full epoch)
# - Batch size: 2 with gradient_accumulation=2 (effective batch=4)
#
# Hypothesis: Larger model + better training dynamics should converge faster on 10K

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 40              # Same as v3 (227M params)
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  param_conditioning: true
  param_dim: 14
  param_embed_dim: 128
  token_conditioning: false

  conditioning_mode: "film"

  film:
    enabled: true
    embed_dim: 128
    hidden_dim: 256
    init_gamma: 1.0
    init_beta: 0.0
    post_norm: true

    modulate_encoder: true
    modulate_decoder: true
    encoder_levels: null
    decoder_levels: null

    modulate_afno_post: false
    afno_blocks: null

training:
  n_samples: 10000               # Using 10K from 50K dataset
  sampling_strategy: "sequential"
  batch_size: 2
  gradient_accumulation_steps: 2
  epochs: 5                      # Quick test: 5 epochs to evaluate
  learning_rate: 5.0e-5          # Same as v3
  warmup_steps: 2500             # Scaled: 1 epoch for 10K (was 5000 for 20K)
  weight_decay: 1.0e-4
  clip_grad: 1.0

  timesteps: 256
  bptt_window: 32

  early_stopping_patience: 10

loss:
  mode: "mse_led"
  lambda_traj: 1.0
  lambda_ic: 0.3

data:
  dataset_path: "datasets/cno_50k_v3_1.h5"
  config: "configs/experiments/cno_50k_v3_1.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/noa/film_50k_10k_v3"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42

# Expected performance:
# - 227M parameters (same as 20K v3)
# - 4500 batches/epoch vs 9000 for 20K (2x faster)
# - ~12 hours/epoch vs 25 hours for 20K
# - Target: match or exceed old film_10k_v3 (val_loss=0.619 by epoch 3)
# - Hypothesis: larger model + better training should converge faster/better
