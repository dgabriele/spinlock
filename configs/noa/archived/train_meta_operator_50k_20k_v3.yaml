# FiLM Modulation Training on 50K v3.1 CNO Dataset (20K samples) - v3
# Balanced approach: moderate model increase + improved training dynamics
#
# Changes from v1:
# - Modest capacity increase: base_channels 32 -> 40 (~1.5x parameters, ~230M total)
# - Longer warmup: 2500 -> 5000 steps (1 full epoch)
# - Lower initial LR: 1e-4 -> 5e-5 for stability
# - Reduced batch size: 4 -> 2 (fits in GPU memory)
# - Gradient accumulation: 2 steps (effective batch=4)

model:
  spatial_dim: 64
  in_channels: 1
  out_channels: 1
  base_channels: 40              # INCREASED: 32 -> 40 (moderate increase)
  encoder_levels: 3
  modes: 16
  afno_blocks: 4
  param_conditioning: true
  param_dim: 14
  param_embed_dim: 128

  conditioning_mode: "film"

  film:
    enabled: true
    embed_dim: 128
    hidden_dim: 256
    init_gamma: 1.0
    init_beta: 0.0
    post_norm: true

    modulate_encoder: true
    modulate_decoder: true
    encoder_levels: null
    decoder_levels: null

    modulate_afno_post: false
    afno_blocks: null

training:
  n_samples: 20000
  sampling_strategy: "sequential"
  batch_size: 2                  # REDUCED: 4 -> 2 for memory
  gradient_accumulation_steps: 2 # Effective batch_size = 4
  epochs: 50
  learning_rate: 5.0e-5          # DECREASED: 1e-4 -> 5e-5 for stability
  warmup_steps: 5000             # DOUBLED: 2500 -> 5000 (1 full epoch at effective batch=4)
  weight_decay: 1.0e-4
  clip_grad: 1.0

  timesteps: 256
  bptt_window: 32

  early_stopping_patience: 10

loss:
  mode: "mse_led"
  lambda_traj: 1.0
  lambda_ic: 0.3

data:
  dataset_path: "datasets/cno_50k_v3_1.h5"
  config: "configs/experiments/cno_50k_v3_1.yaml"
  val_split: 0.1
  num_workers: 4

checkpointing:
  save_dir: "checkpoints/noa/film_50k_20k_v3"
  save_every: 5
  keep_best: true

device: "cuda"
seed: 42

# Expected improvements over v1:
# - ~230M parameters (1.6x larger)
# - Longer warmup prevents early crash
# - Lower LR improves stability
# - Gradient accumulation maintains effective batch=4
# - Should fit in GPU memory with better performance
