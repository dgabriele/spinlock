# V2 CNN Pretraining Configuration
# Official config for pretraining InitialCNNEncoder via autoencoder reconstruction
#
# This CNN will be used as the pretrained backbone for the initial features
# in the V2 VQ tokenizer.

# Dataset
dataset_path: "datasets/50k_baseline.h5"

# Model architecture
embedding_dim: 384        # CNN output dimension (1.5x scaling for 3 channels, memory-optimized)
in_channels: 1            # Default (will be auto-detected at runtime from data)
use_final_batchnorm: false  # Better variance preservation without final BN

# Training
num_epochs: 100        # Increased from 50 (loss still decreasing)
batch_size: 128
learning_rate: 1.0e-3
val_split: 0.1
weight_decay: 1.0e-4   # Regularization to prevent overfitting
use_augmentation: true # Random flips and 90° rotations

# Optimizer
optimizer: "adamw"     # AdamW better with weight_decay

# Learning rate scheduler
use_scheduler: true
scheduler_type: "cosine"

# Hardware
device: "auto"  # Will use CUDA if available

# Logging
log_every_n_epochs: 1
verbose: true

# Output
output_path: "checkpoints/v2/cnn_pretrained.pt"
