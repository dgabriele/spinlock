# Trajectory Completion Experiment - Random Masking Ablation
#
# Masking: Random windows (50% total observed)
# Ablation: random_windows strategy instead of start_end
# Goal: Compare structured vs random temporal masking

metadata:
  name: "trajectory_completion_random"
  description: "Ablation: trajectory completion with random window masking"
  author: "Daniel"
  version: "1.0.0"

checkpoints:
  vqvae_path: "checkpoints/vqvae/50k_baseline/best_model.pt"
  mno_path: "checkpoints/mno/50k_baseline/meta_operator_best.pt"

data:
  dataset_path: "datasets/50k_baseline.h5"
  batch_size: 32
  val_split: 0.2
  num_workers: 4
  shuffle: true

masking:
  strategy: "random_windows"
  start_percent: 0.3  # Used for total window size
  end_percent: 0.2    # Used for total window size

model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  hierarchical_guidance_weight: 0.1

training:
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  device: "cuda"
  seed: 42
  save_every: 5

output_dir: "experiments/trajectory_completion/results/ablation/random_masking"
