# Trajectory Completion Experiment - Coarse Only Configuration
#
# Masking: Only L0 (coarse) tokens observed, L1 and L2 to predict
# Goal: Test hierarchical guidance - can coarse structure predict fine details?

metadata:
  name: "trajectory_completion_coarse_only"
  description: "Trajectory completion using only coarse (L0) tokens"
  author: "Daniel"
  version: "1.0.0"

checkpoints:
  vqvae_path: "checkpoints/vqvae/50k_baseline/best_model.pt"
  mno_path: "checkpoints/mno/50k_baseline/meta_operator_best.pt"

data:
  dataset_path: "datasets/50k_baseline.h5"
  batch_size: 32
  val_split: 0.2
  num_workers: 4
  shuffle: true

masking:
  strategy: "coarse_only"
  start_percent: 0.0  # Not used for coarse_only
  end_percent: 0.0    # Not used for coarse_only

model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  hierarchical_guidance_weight: 0.3  # Strong guidance for coarse→fine

training:
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  device: "cuda"
  seed: 42
  save_every: 5

output_dir: "experiments/trajectory_completion/results/coarse_only"
