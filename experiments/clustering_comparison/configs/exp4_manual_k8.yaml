# Baseline VQ-VAE Configuration (50K CNO Dataset)
#
# This is the proven baseline configuration achieving:
# - L_recon ≈ 0.015 (quality 98.5%)
# - val_loss ≈ 0.067 (composite metric)
# - ~18% codebook utilization
#
# Architecture:
# - High capacity: 512/1024 embedding/hidden dims
# - Large hierarchical codebooks: 4096/2048/1024 tokens
# - Commitment cost: 0.25 (optimized for utilization)
#
# Note: This configuration represents a well-tuned local optimum.
# Experiments with larger capacity, deeper architectures, and
# feature importance weighting all performed worse.

# Dataset
dataset_path: "datasets/cno_50k_3channel_dev.h5"

# Feature Families
families:
  initial:
    encoder: initial_hybrid
    encoder_params:
      manual_dim: 14
      cnn_embedding_dim: 28
      encode_manual: false
      in_channels: 3

  temporal:
    encoder: TemporalCNNEncoder
    encoder_params:
      embedding_dim: 128
      architecture: "resnet1d_3"

# VQ-VAE Architecture - HIGH CAPACITY
model:
  group_embedding_dim: 512      # DOUBLED from 256
  group_hidden_dim: 1024        # DOUBLED from 512

  # Adaptive compression ratios
  # Set to "auto" to compute ratios based on feature characteristics
  # (variance, dimensionality, information content, correlation)
  compression_ratios: "auto"
  auto_compression_strategy: "balanced"  # Options: "variance", "dimensionality", "information", "balanced"

  # Levels already define the architecture
  levels: []

  # VQ-VAE hyperparameters
  uniform_codebook_init: true
  commitment_cost: 0.05         # LOWERED from 0.25 to reduce encoder commitment to existing codes
  use_ema: true
  decay: 0.99
  dropout: 0.3                  # INCREASED from 0.1 to force using backup codes

  # Auxiliary loss weights
  orthogonality_weight: 0.1
  informativeness_weight: 0.12

# Feature Cleaning
# CRITICAL: pre_categorization=false preserves semantic diversity for clustering
# This allows auto-discovery to find 10-20 behavioral categories instead of just 2
feature_cleaning:
  enabled: true
  pre_categorization: false  # Clean per-category AFTER discovery (default)
  variance_threshold: 1e-10
  deduplicate_threshold: 0.99
  use_intelligent_dedup: true
  outlier_method: "percentile"
  percentile_range: [0.5, 99.5]

# Training
training:
  batch_size: 512               # Reduced from 1024 for larger model
  learning_rate: 0.001
  num_epochs: 700
  optimizer: "adam"
  scheduler: null
  warmup_epochs: 100

  # Category discovery (auto mode)
  category_assignment: "auto"
  num_categories_auto: null
  orthogonality_target: 0.15
  min_features_per_category: 3

  # Category assignment configuration
  category_assignment_config:
    method: "clustering"
    isolated_families: []
    reassign_orphans: true
    gradient_epochs: 500
    gradient_lr: 0.01
    subsample_excess_fraction: 0.1
    device: "cuda"

    # Hierarchical clustering parameters
    linkage_method: "ward"  # Options: "ward", "average", "complete", "single"
    distance_metric: "correlation"  # Options: "correlation", "euclidean", "cosine"

    # K selection strategy
    k_selection_method: "manual"  # Options: "silhouette", "gap_statistic", "elbow", "manual"
    gap_statistic_refs: 10  # Number of reference distributions for gap statistic
    manual_k: 8  # Uncomment to force specific K when k_selection_method="manual"
    # distance_threshold: 0.5  # Uncomment to cut dendrogram at distance (overrides K selection)

    # Dendrogram visualization
    export_dendrogram: true
    dendrogram_path: "experiments/clustering_comparison/results/exp4_manual_k8/dendrograms"

    # Per-family clustering - cluster each family independently
    per_family_clustering: true
    per_family_params:
      initial:
        min_clusters: 2
        max_clusters: 8
        manual_k: 3
        # num_clusters: 3  # Optional: explicit K instead of auto
        # linkage_method: "average"  # Optional: override linkage for this family
        # k_selection_method: "silhouette"  # Optional: override K selection for this family
      temporal:
        min_clusters: 2
        max_clusters: 20
        manual_k: 8
        # k_selection_method: "manual"  # Optional: override K selection for this family

  # Loss weights
  reconstruction_weight: 1.0
  vq_weight: 1.0
  orthogonality_weight: 0.1
  informativeness_weight: 0.1
  topo_weight: 0.3
  topo_samples: 1024
  entropy_weight: 0.1  # Entropy regularization for uniform codebook usage 

  # Checkpointing
  save_every: 25
  checkpoint_dir: "experiments/clustering_comparison/results/exp4_manual_k8/checkpoints"

  # Callbacks
  early_stopping_patience: 100
  early_stopping_min_delta: 0.01

  # Dead code resets - DISABLED
  dead_code_reset_interval: 0
  dead_code_threshold: 5.0
  dead_code_max_reset_fraction: 0.0

  # Validation
  val_every_n_epochs: 5

  # Performance
  use_torch_compile: true

# Logging
logging:
  wandb: false
  log_interval: 100
  eval_interval: 500
  verbose: true

# Random seed
random_seed: 42

# Proven Performance (epoch 100):
# - val_loss: 0.067 (composite)
# - L_recon: ~0.015 (quality: 0.985 = 98.5%)
# - Codebook utilization: ~18%
# - Topology preservation: 0.975 (pre) → 0.998 (post)
# - Model size: 7168 total codes (4096 + 2048 + 1024)
# - Training time: ~2.7s/epoch on GPU with torch.compile
#
# This configuration represents a well-tuned local optimum.
# Alternative architectures tested achieved worse reconstruction.
