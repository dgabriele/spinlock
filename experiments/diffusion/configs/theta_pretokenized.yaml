# Baseline Discrete Diffusion Configuration (Pre-Tokenized)
# 50-step diffusion with RANDOM masking strategy
# Uses pre-tokenized dataset for fast training
# THETA-ENABLED VQVAE (theta + initial + temporal features)

# Dataset paths
dataset:
  tokenized_path: "datasets/50k_baseline_tokenized_theta.h5"  # Pre-tokenized dataset with theta
  use_pretokenized: true  # Use pre-tokenized data (fast)

# Masking strategy
masking:
  strategy: "random"  # Primary strategy: random masking per category-level
  mask_probability: 0.5  # 50% of category-levels masked
  seed: 42

# Diffusion schedule
diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule_type: "cosine"  # Cosine schedule (Nichol & Dhariwal, 2021)

# Denoising network
model:
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  use_hierarchical_guidance: true
  hierarchical_guidance_weight: 0.1

# Training
training:
  batch_size: 32  # Can increase with pre-tokenized data
  num_epochs: 30
  num_workers: 0  # Keep 0 to avoid multiprocessing issues
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0

  # Learning rate schedule
  lr_scheduler:
    type: "cosine"  # Cosine annealing
    warmup_epochs: 2
    min_lr: 1.0e-6

  # Validation
  val_batch_size: 128
  val_frequency: 1  # Validate every N epochs
  val_samples: 5  # Number of full diffusion samples per validation

  # Checkpointing
  checkpoint_frequency: 5  # Save every N epochs
  save_best: true  # Save best model based on validation loss

  # Logging
  log_frequency: 50  # Log every N batches
  use_wandb: false  # Set to true to enable W&B logging

# Output
output:
  dir: "experiments/diffusion/results/theta_baseline_50steps_pretokenized"
  checkpoint_prefix: "diffusion_theta_pretokenized"

# Device
device: "cuda"
seed: 42
