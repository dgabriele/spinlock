# D3PM Temporal Resolution — CNO VQ Tokenizer v1
#
# Exact mirror of experiments/diffusion/configs/v5_temporal_resolution.yaml
# adapted for the CNO dataset and tokenizer.
#
# Requires pretokenizing the CNO dataset first:
#   spinlock pretokenize-dataset \
#     --dataset datasets/50k_baseline.h5 \
#     --tokenizer checkpoints/cno/v1/vq_tokenizer_best.pt \
#     --output datasets/cno_50k_v1_temporal_resolution.h5 \
#     --temporal-resolution --batch-size 128

dataset:
  tokenized_path: "datasets/cno_50k_v1_temporal_resolution.h5"
  tokenizer_checkpoint: "checkpoints/cno/v1/vq_tokenizer_best.pt"
  use_pretokenized: true

masking:
  strategy: "random"
  mask_probability: 0.5
  seed: 42

diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule_type: "cosine"
  transition_type: "uniform"
  beta_scaling: "uniform"

model:
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  use_hierarchical_guidance: true
  hierarchical_guidance_weight: 0.1
  hierarchical_guidance_mode: "per_category"

  temporal_resolution:
    enabled: true
    use_temporal_bias: true
    temporal_bias_init: "causal"
    temporal_bias_strength: 0.1
    enforce_causality: true

training:
  batch_size: 32
  num_epochs: 10
  num_workers: 0
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0

  use_snr_weighting: true
  use_vocab_size_weighting: true

  lr_scheduler:
    type: "cosine"
    warmup_epochs: 2
    min_lr: 1.0e-6

  val_batch_size: 64
  val_split: 0.1
  val_frequency: 1
  val_samples: 5

  checkpoint_frequency: 5
  save_best: true

  log_frequency: 50
  use_wandb: false

output:
  dir: "experiments/diffusion/results/cno_v1_temporal_resolution"
  checkpoint_prefix: "cno_v1_temporal_resolution_d3pm"

device: "cuda"
seed: 42
