# Theta-Aware Discrete Diffusion Configuration
# Uses VQVAE with theta (parameter) + initial + temporal embeddings
# 50-step diffusion with RANDOM masking strategy

# Dataset paths
dataset:
  path: "datasets/50k_baseline.h5"  # Path to CNO dataset (50K baseline)
  tokenizer_checkpoint: "checkpoints/vqvae/theta_topo_50k/vq_tokenizer_best.pt"  # Theta-enabled VQTokenizer
  cache_tokens: true  # Enable LRU caching
  max_cache_size: 5000  # LRU cache size (5K samples ~= 3-4GB RAM)
  device: "cuda"  # Device for tokenization

# Masking strategy
masking:
  strategy: "random"  # Primary strategy: random masking per category-level
  mask_probability: 0.5  # 50% of category-levels masked
  seed: 42

# Diffusion schedule
diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule_type: "cosine"  # Cosine schedule (Nichol & Dhariwal, 2021)

# Denoising network
model:
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  use_hierarchical_guidance: true
  hierarchical_guidance_weight: 0.1

# Training
training:
  batch_size: 32  # Reduced from 64 to fit in 6GB GPU memory
  num_epochs: 30
  num_workers: 0  # Disable multiprocessing to avoid CUDA fork issues
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0

  # Learning rate schedule
  lr_scheduler:
    type: "cosine"  # Cosine annealing
    warmup_epochs: 2
    min_lr: 1.0e-6

  # Validation
  val_batch_size: 128
  val_frequency: 1  # Validate every N epochs
  val_samples: 5  # Number of full diffusion samples per validation

  # Checkpointing
  checkpoint_frequency: 5  # Save every N epochs
  save_best: true  # Save best model based on validation loss

  # Logging
  log_frequency: 50  # Log every N batches
  use_wandb: false  # Set to true to enable W&B logging

# Output
output:
  dir: "experiments/diffusion/results/theta_baseline_50steps"
  checkpoint_prefix: "diffusion_theta"

# Device
device: "cuda"
seed: 42
