# D3PM Temporal Resolution — VQ Tokenizer v5
#
# Variable-length diffusion: each sample is tokenized at 4 truncation lengths
# [T=32, T=64, T=128, T=256], and the diffusion model jointly denoises all
# truncations with causal temporal attention (later truncations see earlier ones).
#
# Incorporates all safe D3PM improvements from improved_safe_changes.yaml:
#   - SNR weighting (1/beta_t per timestep)
#   - Vocab-size normalization (log(V)/log(V_max))
#   - Per-category hierarchical guidance
#   - Eval-mode attention unmasking (automatic)
#
# Tokenizer: checkpoints/v5/pyramid/vq_tokenizer_best.pt
# Dataset:   datasets/qbm_50k_v5_temporal_resolution.h5  (pretokenized at 4 bins)

dataset:
  tokenized_path: "datasets/qbm_50k_v5_temporal_resolution.h5"
  tokenizer_checkpoint: "checkpoints/v5/pyramid/vq_tokenizer_best.pt"
  use_pretokenized: true

masking:
  strategy: "random"
  mask_probability: 0.5
  seed: 42

diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule_type: "cosine"
  transition_type: "uniform"
  beta_scaling: "uniform"

model:
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  use_hierarchical_guidance: true
  hierarchical_guidance_weight: 0.1
  hierarchical_guidance_mode: "per_category"  # family-local guidance

  temporal_resolution:
    enabled: true
    use_temporal_bias: true          # learnable [N_trunc, N_trunc] attention bias
    temporal_bias_init: "causal"     # initialize with late → early prior
    temporal_bias_strength: 0.1
    enforce_causality: true          # hard-mask non-causal attention

training:
  batch_size: 32
  num_epochs: 10
  num_workers: 0
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0

  use_snr_weighting: true
  use_vocab_size_weighting: true

  lr_scheduler:
    type: "cosine"
    warmup_epochs: 2
    min_lr: 1.0e-6

  val_batch_size: 64
  val_split: 0.1
  val_frequency: 1
  val_samples: 5

  checkpoint_frequency: 5
  save_best: true

  log_frequency: 50
  use_wandb: false

output:
  dir: "experiments/diffusion/results/v5_temporal_resolution"
  checkpoint_prefix: "v5_temporal_resolution_d3pm"

device: "cuda"
seed: 42
