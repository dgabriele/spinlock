# D3PM v11 Stabilized Refinement
#
# Returns to v9's on-policy training (D3PM's own roundtrip-verified completions)
# with four stabilization mechanisms to prevent the catastrophic forgetting and
# distribution drift observed in v10:
#
#   1. Weight anchoring: L2 penalty toward v8 base prevents catastrophic drift
#   2. Replay buffer: reservoir sampling accumulates on-policy targets across cycles
#   3. LR scheduling: cosine within cycle + multiplicative decay across cycles
#   4. Eval-based early stopping: patience mechanism with best-checkpoint recovery
#
# v10 post-mortem: GT-token training degraded from 0.7452 → 0.6949 over 3 cycles
# due to train/test distribution mismatch (teacher-forced GT vs on-policy inference),
# catastrophic forgetting (no replay), and no LR scheduling.

d3pm_checkpoint: "experiments/diffusion/results/v8_joint/v8_joint_d3pm_best.pt"
mno_checkpoint: null  # GT simulator (LeniaReplayAdapter)
tokenizer_checkpoint: "checkpoints/lenia/vq/v3_fourier_10k/vq_tokenizer_best.pt"

dataset_path: "datasets/ds_lenia_fourier_10k.h5"
max_samples: 10000
rollout_steps: 512

num_refinement_cycles: 10
mask_probability: 0.5
d3pm_start_step: null
d3pm_n_candidates: 4
max_accepted_targets: 1000
generation_batch_size: 48

# On-policy training (NOT GT tokens)
train_on_gt: false
eval_samples: 96
eval_frequency: 1
early_stopping_patience: 3

quality_filter:
  min_observed_agreement: 0.8

adaptive:
  initial_d3pm_candidates: 2
  perturbation:
    enabled: true
    initial_sigma: 0.03
    sigma_growth_factor: 1.5
    max_sigma: 0.15
    perturbations_per_round: 4
    freeze_categorical_dims: true
    categorical_dim_indices: [32, 33]
  budget:
    min_extra_candidates: 2
    max_extra_candidates: 16
    budget_scaling: "linear"
    d3pm_fraction: 0.5
  stopping:
    max_rounds_per_sample: 4
    min_acceptance_rate: 0.05
    acceptance_rate_window: 200
    min_loss_improvement: 0.001

fine_tuning:
  learning_rate: 2.0e-5
  num_epochs: 5
  batch_size: 128
  gradient_clip_norm: 1.0
  weight_decay: 1.0e-5
  # v11 stabilization
  anchor_weight: 0.05
  replay_fraction: 0.3
  max_replay_size: 5000
  use_cosine_schedule: true
  warmup_fraction: 0.1
  min_lr_fraction: 0.1
  per_cycle_lr_decay: 0.9

output_dir: "experiments/diffusion/results/v11_stabilized"
device: "cuda"
seed: 42
