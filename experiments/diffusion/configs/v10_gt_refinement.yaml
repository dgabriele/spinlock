# D3PM v10 GT-Token Refinement
#
# Trains on ground-truth tokens directly (no D3PM inference / quality filter).
# Every novel Sobol sample becomes a training target with perfect agreement.
#
# Key differences from v9:
#   - train_on_gt: true — skips D3PM + adaptive search (~6x faster per cycle)
#   - eval_samples: 96 — fixed held-out set for apples-to-apples evaluation
#   - More fine-tuning epochs (8 vs 5) since GT targets are higher quality
#
# Pipeline per cycle:
#   1. Novel Sobol → Fourier IC → GT rollout → tokenize → all tokens become targets
#   2. Fine-tune D3PM on GT targets (no filtering)
#   3. Evaluate on held-out set: D3PM inpaint → roundtrip → measure agreement

d3pm_checkpoint: "experiments/diffusion/results/v8_joint/v8_joint_d3pm_best.pt"
mno_checkpoint: null  # GT simulator (LeniaReplayAdapter)
tokenizer_checkpoint: "checkpoints/lenia/vq/v3_fourier_10k/vq_tokenizer_best.pt"

dataset_path: "datasets/ds_lenia_fourier_10k.h5"
max_samples: 10000
rollout_steps: 512

num_refinement_cycles: 10
mask_probability: 0.5
d3pm_start_step: null
d3pm_n_candidates: 4
max_accepted_targets: 1000
generation_batch_size: 48

# GT-token training mode
train_on_gt: true
eval_samples: 96
eval_frequency: 1

quality_filter:
  min_observed_agreement: 0.8

adaptive:
  initial_d3pm_candidates: 2
  perturbation:
    enabled: true
    initial_sigma: 0.03
    sigma_growth_factor: 1.5
    max_sigma: 0.15
    perturbations_per_round: 4
    freeze_categorical_dims: true
    categorical_dim_indices: [32, 33]
  budget:
    min_extra_candidates: 2
    max_extra_candidates: 16
    budget_scaling: "linear"
    d3pm_fraction: 0.5
  stopping:
    max_rounds_per_sample: 4
    min_acceptance_rate: 0.05
    acceptance_rate_window: 200
    min_loss_improvement: 0.001

fine_tuning:
  learning_rate: 2.0e-5
  num_epochs: 8
  batch_size: 128
  gradient_clip_norm: 1.0
  weight_decay: 1.0e-5

output_dir: "experiments/diffusion/results/v10_gt_refinement"
device: "cuda"
seed: 42
