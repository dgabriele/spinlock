# Autonomous Rosetta Alignment Training
# ======================================
# Self-play bootstrap for the contrastive alignment between the
# denoiser's token space and the LLM's English space.
#
# Usage:
#   poetry run spinlock train-alignment \
#       --synthesis-config experiments/token_synthesis/configs/qbm_synthesis.yaml
#
# Or with this config's defaults overridden:
#   poetry run spinlock train-alignment \
#       --synthesis-config experiments/token_synthesis/configs/qbm_synthesis.yaml \
#       --num-cycles 100 --queries-per-cycle 20

# Training loop parameters
num_cycles: 50
queries_per_cycle: 10
candidates_per_query: 16
checkpoint_frequency: 5

# Query taxonomy — null means all categories
# Options: physics_targeted, abstract_physical, philosophical, consciousness, contrastive
enabled_categories: null

# Discovery feedback loop
discovery_history_size: 50

# Description enrichment (Phase 3)
# When True, top candidates get LLM-enriched descriptions (slower but richer)
use_hybrid_descriptions: false
max_enrichments_per_cycle: 8

# Pair accumulation strategy
# If false (default), only pairs scoring >= reward_threshold enter the buffer
# If true, ALL pairs enter regardless of score (for experimentation)
accumulate_all: false

# Output
output_dir: "experiments/alignment/results"
